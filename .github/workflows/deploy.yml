name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Syntax check
        run: for f in server/*.js public/js/*.js public/js/shared/*.js; do node --check "$f"; done
      - name: Sim tests
        run: |
          node scripts/level-sync-test.mjs
          node scripts/playthrough-test.mjs
          node scripts/rules-test.mjs
          node scripts/moderation-test.mjs
          node scripts/ice-pattern-test.mjs --levels 1-3 --seeds 3
          node -e "import('./public/js/shared/maze.js').then(m => { const r = m.mazeSelfTest(4); if (!r.ok) { console.log(r.problems); process.exit(1); } console.log('maze self-test ok'); })"
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the server's authorized_keys pins this key to deploy.sh, so no command is needed
          ssh rkr@80.47.225.25
