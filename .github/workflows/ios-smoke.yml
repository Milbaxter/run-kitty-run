name: iOS smoke test
# Builds the Simulator app, runs it on an iPhone + iPad simulator, drives the WebView over the Web Inspector
# protocol (ios_webkit_debug_proxy; Capacitor debug builds are inspectable), exercises the runkittyrun:// deep link,
# and uploads screenshots + native/JS logs as the "ios-smoke" artifact.
on:
  workflow_dispatch:
  push:
    branches: [mobile-apps]
    paths:
      - 'ios/**'
      - 'public/**'
      - 'capacitor.config.json'
      - '.github/workflows/ios-smoke.yml'

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: false # a cold simulator boot takes ~4 min; don't throw runs away

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync ios
      - name: Simulator build
        run: |
          xcodebuild -version
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Install ios_webkit_debug_proxy
        continue-on-error: true
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ios-webkit-debug-proxy
      - name: Write WebView driver
        run: |
          cat > "$GITHUB_WORKSPACE/smoke-drive.mjs" <<'EOF'
          // node drive.mjs '<js expression>'  -> evaluates in the app's WKWebView, prints the result + console messages.
          import WebSocket from 'ws';
          const expr = process.argv[2];
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          setTimeout(() => { console.log('DRIVER_TIMEOUT'); process.exit(3); }, 40000);
          let pages = [];
          for (let i = 0; i < 20 && !pages.length; i++) {
            try { pages = (await (await fetch('http://127.0.0.1:9222/json', { signal: AbortSignal.timeout(3000) })).json()).filter((p) => p.webSocketDebuggerUrl); } catch {}
            if (!pages.length) await sleep(1000);
          }
          if (!pages.length) { console.log('NO_INSPECTABLE_PAGE'); process.exit(2); }
          const page = pages.find((p) => /localhost/.test(p.url)) || pages[0];
          console.log('page:', page.url, page.title);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((r, j) => { ws.on('open', r); ws.on('error', j); });
          let target = null, nextId = 1;
          const waiting = new Map();
          const onInner = (m) => {
            if (m.id && waiting.has(m.id)) { waiting.get(m.id)(m); waiting.delete(m.id); }
            else if (m.method === 'Console.messageAdded') {
              const c = m.params.message;
              console.log(`[console.${c.level}] ${c.text}${c.url ? ` (${c.url.split('/').pop()}:${c.line})` : ''}`);
            }
          };
          ws.on('message', (d) => {
            const m = JSON.parse(d);
            if (m.method === 'Target.targetCreated') { if (!target) target = m.params.targetInfo.targetId; }
            else if (m.method === 'Target.dispatchMessageFromTarget') onInner(JSON.parse(m.params.message));
            else onInner(m);
          });
          await sleep(1500); // Target.targetCreated arrives right away on target-based (iOS 12.2+) backends
          const send = (method, params = {}) => new Promise((resolve) => {
            const id = nextId++;
            waiting.set(id, resolve);
            const msg = JSON.stringify({ id, method, params });
            if (target) ws.send(JSON.stringify({ id: 100000 + id, method: 'Target.sendMessageToTarget', params: { targetId: target, message: msg } }));
            else ws.send(msg);
            setTimeout(() => { if (waiting.has(id)) { waiting.delete(id); resolve({ timeout: true }); } }, 10000);
          });
          await send('Runtime.enable');
          await send('Console.enable'); // replays the console messages logged so far
          await sleep(500);
          const r = await send('Runtime.evaluate', { expression: expr, returnByValue: true });
          const res = r.result && r.result.result;
          console.log('RESULT:', r.timeout ? 'TIMEOUT' : r.error ? JSON.stringify(r.error) : (r.result.wasThrown ? 'THROWN ' : '') + JSON.stringify(res && (res.value !== undefined ? res.value : res.description)));
          ws.close();
          process.exit(0);
          EOF
      - name: Run on simulators
        timeout-minutes: 25
        run: |
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; } # timeout: nothing here may hang the job
          OUT="$GITHUB_WORKSPACE/smoke"; mkdir -p "$OUT"
          APP=ios/App/build/sim/Build/Products/Debug-iphonesimulator/App.app
          BID=io.runkittyrun.app
          drive() { (cd "$GITHUB_WORKSPACE" && to 60 node "$GITHUB_WORKSPACE/smoke-drive.mjs" "$1") 2>&1 | tee -a "$LOG_JS" || true; }
          shot() { to 30 xcrun simctl io "$UDID" screenshot "$OUT/$TAG-$1.png" || true; }
          STATE='JSON.stringify((() => { const k = window.__kitty || {}; const p = document.createElement("div"); p.style.cssText = "position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"; document.body.appendChild(p); const cs = getComputedStyle(p); const safe = [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(" "); p.remove(); return { href: location.href, w: innerWidth, h: innerHeight, dpr: devicePixelRatio, safe, native: !!(window.Capacitor && Capacitor.isNativePlatform()), platform: window.Capacitor && Capacitor.getPlatform(), simState: k.sim && k.sim.state, players: k.sim && k.sim.kitties && k.sim.kitties.length, online: k.online && { playing: k.online.playing, room: k.online.room && k.online.room.code }, connected: k.net && k.net.connected, frames: window.__fc, audioCtx: k.audio && k.audio.ctx && k.audio.ctx.state, overlays: [...document.querySelectorAll("#ui > *, .rkt-modal")].filter((e) => e.offsetParent || getComputedStyle(e).position === "fixed").map((e) => e.className || e.id).slice(0, 12), buttons: [...document.querySelectorAll("button")].filter((b) => b.offsetParent).map((b) => b.textContent.trim()).slice(0, 15), rotateMsg: getComputedStyle(document.getElementById("rotate")).display }; })())'

          RT=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          echo "runtime: $RT"
          pick() { xcrun simctl list devices available -j | jq -r --arg rt "$RT" --arg re "$1" '.devices[$rt][]? | select(.name | test($re)) | .udid' | head -1; }
          IPHONE=$(pick '^iPhone [0-9]+ Pro$'); [ -n "$IPHONE" ] || IPHONE=$(pick '^iPhone')
          IPAD=$(pick '^iPad Pro'); [ -n "$IPAD" ] || IPAD=$(pick '^iPad')
          xcrun simctl list devices available | tee "$OUT/devices.txt"
          [ -n "$IPAD" ] && xcrun simctl boot "$IPAD" & # first boot is slow (data migration): warm the iPad up meanwhile

          for UDID in $IPHONE $IPAD; do
            NAME=$(xcrun simctl list devices -j | jq -r --arg u "$UDID" '.devices[][] | select(.udid == $u) | .name')
            TAG=$(echo "$NAME" | tr ' ()' '_--')
            LOG_JS="$OUT/$TAG-webview.txt"
            echo "=== $NAME ($UDID)" | tee "$LOG_JS"
            echo "::group::$NAME"; date
            xcrun simctl boot "$UDID" || true
            to 300 xcrun simctl bootstatus "$UDID" -b || true
            to 120 xcrun simctl install "$UDID" "$APP"
            START=$(date "+%Y-%m-%d %H:%M:%S")
            SOCK=$(ls /private/tmp/com.apple.launchd.*/com.apple.webinspectord_sim.socket 2>/dev/null | head -1)
            IWDP=
            if command -v ios_webkit_debug_proxy >/dev/null && [ -n "$SOCK" ]; then
              ios_webkit_debug_proxy -s "unix:$SOCK" -F > "$OUT/$TAG-iwdp.txt" 2>&1 & IWDP=$!
            fi
            to 60 xcrun simctl launch "$UDID" "$BID"
            sleep 3; shot 00-splash
            sleep 6; shot 01-title
            curl -s -m 5 http://127.0.0.1:9221/json > "$OUT/$TAG-iwdp-devices.json" || true
            curl -s -m 5 http://127.0.0.1:9222/json > "$OUT/$TAG-iwdp-pages.json" || true
            echo "--- title state" >> "$LOG_JS"; drive "$STATE"
            # Solo run (same as tapping 1 PLAYER on the title screen), count rendered frames for 3 s.
            echo "--- start solo" >> "$LOG_JS"
            drive 'window.__fc = 0; (function f() { window.__fc++; requestAnimationFrame(f); })(); window.__kitty.startGame(1); "started"'
            sleep 3; shot 02-solo
            echo "--- solo state (frames in ~3s)" >> "$LOG_JS"; drive "$STATE"
            drive 'window.__kitty.advance(4); window.__kitty.keys && (window.__kitty.keys.right = true); "advanced"'
            sleep 2; shot 03-solo-later
            echo "--- solo later state" >> "$LOG_JS"; drive "$STATE"
            # Deep link while running: should leave the run and open the online lobby (terms notice first time).
            to 30 xcrun simctl openurl "$UDID" "runkittyrun://join?room=TEST" || true
            sleep 5; shot 04-deeplink
            echo "--- after deep link" >> "$LOG_JS"; drive "$STATE"
            drive '(() => { const b = [...document.querySelectorAll("button")].find((b) => /I AGREE/.test(b.textContent)); if (b) b.click(); return b ? "agreed" : "no terms button"; })()'
            sleep 5; shot 05-lobby
            echo "--- lobby state" >> "$LOG_JS"; drive "$STATE"
            # Cold start from a deep link.
            to 30 xcrun simctl terminate "$UDID" "$BID" || true
            sleep 1
            to 30 xcrun simctl openurl "$UDID" "runkittyrun://join?room=COLD" || true
            sleep 9; shot 06-coldlink
            echo "--- cold deep link state" >> "$LOG_JS"; drive "$STATE"
            to 120 xcrun simctl spawn "$UDID" log show --start "$START" --style compact --info --debug \
              --predicate 'process == "App" OR process CONTAINS "WebContent" OR (process == "SpringBoard" AND eventMessage CONTAINS[c] "runkittyrun")' \
              > "$OUT/$TAG-device-log.txt" 2>&1 || true
            grep -E '⚡️|\[error\]|\[warn\]|Error|error' "$OUT/$TAG-device-log.txt" | grep -v -i 'nw_\|tcp_\|boringssl' | head -300 > "$OUT/$TAG-log-highlights.txt" || true
            [ -n "$IWDP" ] && kill $IWDP || true
            to 60 xcrun simctl shutdown "$UDID" || true; echo "::endgroup::"
          done
          pkill -f ios_webkit_debug_proxy || true
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: smoke/
