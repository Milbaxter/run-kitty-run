name: Mobile apps
# Builds the Capacitor iOS + Android apps on every relevant push/PR (debug APK, signed AAB, Simulator .app as artifacts).
# Store uploads only happen from "Run workflow" (workflow_dispatch) with release_ios / release_android ticked.
# Setup + secrets: docs/MOBILE.md
on:
  push:
    branches: [main, mobile-apps]
    paths:
      - 'public/**'
      - 'ios/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/build-www.mjs'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/mobile.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      release_ios:
        description: 'Upload iOS build to TestFlight'
        type: boolean
        default: false
      release_android:
        description: 'Upload Android build to Google Play'
        type: boolean
        default: false
      play_track:
        description: 'Play track (internal = instant testers; alpha = closed testing)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: 'Play release status (draft until the app has been published once)'
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Store build numbers must only ever go up: every workflow run gets the next one (iOS build + Android versionCode).
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in server/*.js public/js/*.js public/js/shared/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Sim tests
        run: |
          node scripts/level-sync-test.mjs
          node scripts/playthrough-test.mjs
          node scripts/rules-test.mjs
          node -e "import('./public/js/shared/maze.js').then(m => { const r = m.mazeSelfTest(4); if (!r.ok) { console.log(r.problems); process.exit(1); } console.log('maze self-test ok'); })"
      - name: Moderation tests
        run: if [ -f scripts/moderation-test.mjs ]; then node scripts/moderation-test.mjs; else echo "no moderation test"; fi

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      RKR_KEYSTORE_BASE64: ${{ secrets.RKR_KEYSTORE_BASE64 }}
      RKR_KEYSTORE_PASSWORD: ${{ secrets.RKR_KEYSTORE_PASSWORD }}
      RKR_KEY_ALIAS: ${{ secrets.RKR_KEY_ALIAS }}
      RKR_KEY_PASSWORD: ${{ secrets.RKR_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # caches ~/.gradle
      - name: Android SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/build-tools/36.0.0" ] && exit 0
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync android
      - name: Signing key
        run: |
          if [ -n "$RKR_KEYSTORE_BASE64" ]; then
            echo "$RKR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RKR_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release AAB will be signed with the upload key."
          else
            echo "::warning::RKR_KEYSTORE_* secrets not set - the release AAB is unsigned (not uploadable to Play)."
          fi
      - name: Gradle build
        working-directory: android
        env:
          RKR_VERSION_CODE: ${{ env.BUILD_NUMBER }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Ruby + fastlane
        if: github.event_name == 'workflow_dispatch' && inputs.release_android
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.release_android
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] || [ -z "$RKR_KEYSTORE_FILE" ]; then
            echo "::error::Need PLAY_SERVICE_ACCOUNT_JSON and RKR_KEYSTORE_* secrets to upload (docs/MOBILE.md)"; exit 1
          fi
          bundle exec fastlane android internal track:${{ inputs.play_track }} status:${{ inputs.play_status }}

  ios:
    needs: test
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      # App Store uploads must be built with the newest Xcode/SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync ios
      - name: Simulator build
        run: |
          xcodebuild -version
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Zip Simulator app
        run: |
          cd ios/App/build/sim/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/RunKittyRun-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: RunKittyRun-simulator.zip
          if-no-files-found: error
      - name: Ruby + fastlane
        if: github.event_name == 'workflow_dispatch' && inputs.release_ios
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.release_ios
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Need ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID secrets (docs/MOBILE.md)"; exit 1
          fi
          bundle exec fastlane ios beta build:"$BUILD_NUMBER"
