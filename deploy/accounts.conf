# Optional accounts (server/accounts.js): systemd drop-in, installed as
#   /etc/systemd/system/run-kitty-run.service.d/accounts.conf
# Secrets live in a root-only file (0600; systemd reads it before dropping to user rkr):
#   GOOGLE_CLIENT_ID, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, PUBLIC_ORIGIN, CURRENCY
# Without it the server runs with accounts off. After changing either file: sudo systemctl daemon-reload && sudo systemctl restart run-kitty-run
[Service]
EnvironmentFile=-/etc/run-kitty-run/accounts.env
# accounts + payment ledger (payments.jsonl) next to the other state; never copy local test files here
Environment=ACCOUNTS_FILE=/var/lib/run-kitty-run/accounts.json
# The app tightens existing account/payment files to 0600 when it starts. Install the current base unit
# separately to also apply StateDirectoryMode=0700 and UMask=0077 (units are not auto-deployed).
