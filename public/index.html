<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Run Kitty Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; overscroll-behavior: none; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  img, svg { -webkit-user-drag: none; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  /* phones held upright: ask to rotate */
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0d1020; color: #fff6d8;
    font: 800 20px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 24px; }
  #rotate .ph { width: 54px; height: 90px; border: 5px solid #ffcf5a; border-radius: 12px; animation: rkr-rot 2.4s ease-in-out infinite; }
  @keyframes rkr-rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { html.rkr-touch #rotate { display: flex; } }
  html.rkr-native #rotate { display: none !important; } /* the apps are locked to landscape */
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="rotate"><div class="ph"></div>Turn your phone sideways to play</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
