<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  /* phones held upright: ask to rotate */
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0d1020; color: #fff6d8;
    font: 800 20px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 24px; }
  #rotate .ph { width: 54px; height: 90px; border: 5px solid #ffcf5a; border-radius: 12px; animation: rkr-rot 2.4s ease-in-out infinite; }
  @keyframes rkr-rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { html.rkr-touch #rotate { display: flex; } }
</style>
