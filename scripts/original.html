function createPortalModel() {
  const R = CFG.CENTER_RADIUS - 0.6;
  const group = new THREE.Group();
  group.name = 'portal';

  // stone dais (low so kitties walk on it)
  const dais = cgeo('portalDais', () => {
    const parts = [
      [P.cyl18, mtx([0, 0.02, 0], null, [R + 0.3, 0.04, R + 0.3]), 0x585c78],
      [P.cyl18, mtx([0, 0.025, 0], null, [R - 0.1, 0.05, R - 0.1]), 0x7a7f9e],
      [P.cyl8, mtx([0, 0.03, 0], [0, Math.PI / 8, 0], [1.9, 0.06, 1.9]), 0x8e94b6],
    ];
    const n = 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU_;
      parts.push([P.box, mtx([Math.cos(a) * (R + 0.15), 0.05, Math.sin(a) * (R + 0.15)], [0, -a, 0], [0.32, 0.1, 0.62]), i % 2 ? 0x666a88 : 0x707494]);
    }
    return bake(parts);
  });
  const daisMesh = new THREE.Mesh(dais, VC_MAT());
  daisMesh.receiveShadow = true;
  group.add(daisMesh);

  // swirling energy
  const swirlMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 1 }, uR: { value: R - 0.35 }, uColA: { value: new THREE.Color(0x3fd8ff) }, uColB: { value: new THREE.Color(0xd8a0ff) } },
    vertexShader: SWIRL_VS, fragmentShader: SWIRL_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const swirl = new THREE.Mesh(flatDisc(R - 0.35, 64), swirlMat);
  swirl.position.y = 0.065; swirl.renderOrder = 1; group.add(swirl);

  // rune rings
  const runeCol = new THREE.Color(0x6fe6ff);
  const runeMat = new THREE.MeshBasicMaterial({ map: runeTexture(), color: runeCol.clone().multiplyScalar(1.6), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  const runeOuter = new THREE.Mesh(flatRing(R * 0.8, R * 1.0, 96), runeMat);
  runeOuter.position.y = 0.075; runeOuter.renderOrder = 2; group.add(runeOuter);
  const runeInnerMat = runeMat.clone(); runeInnerMat.color = new THREE.Color(0xffd27a).multiplyScalar(1.6);
  const runeInner = new THREE.Mesh(flatRing(1.75 * 0.8, 1.75, 64), runeInnerMat);
  runeInner.position.y = 0.08; runeInner.renderOrder = 2; group.add(runeInner);

  // light beams + crystal shards around the rim
  const beamMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0x5fdcff) }, uIntensity: { value: 1 }, uTime: { value: 0 } },
    vertexShader: BEAM_VS, fragmentShader: BEAM_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const beamGeo = new THREE.CylinderGeometry(0.06, 0.16, 4.5, 8, 1, true); beamGeo.translate(0, 2.25, 0);
  const shardMat = new THREE.MeshStandardMaterial({ color: 0x9ff0ff, emissive: 0x3fd0ff, emissiveIntensity: 1.4, flatShading: true, roughness: 0.25 });
  const shardGeo = bake([
    [P.oct, mtx([0, 0.28, 0], null, [0.12, 0.3, 0.12]), 0xffffff],
    [P.oct, mtx([0.08, 0.16, 0.04], [0, 0, -0.5], [0.06, 0.16, 0.06]), 0xffffff],
    [P.oct, mtx([-0.06, 0.14, -0.05], [0.4, 0, 0.4], [0.05, 0.13, 0.05]), 0xffffff],
  ]);
  const beams = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU_ + Math.PI / 12;
    const x = Math.cos(a) * (R + 0.15), z = Math.sin(a) * (R + 0.15);
    const b = new THREE.Mesh(beamGeo, beamMat); b.position.set(x, 0.08, z); b.renderOrder = 3; group.add(b); beams.push(b);
    const sh = new THREE.Mesh(shardGeo, shardMat); sh.position.set(x, 0.08, z); sh.rotation.y = a; sh.castShadow = true; group.add(sh);
  }

  // central column + floating crystal
  const colMat = beamMat.clone();
  colMat.uniforms = { uColor: { value: new THREE.Color(0xc8b4ff) }, uIntensity: { value: 1 }, uTime: { value: 0 } };
  const colGeo = new THREE.CylinderGeometry(0.35, 0.75, 2.8, 16, 1, true); colGeo.translate(0, 1.4, 0);
  const column = new THREE.Mesh(colGeo, colMat); column.position.y = 0.08; column.renderOrder = 3; group.add(column);

  const crystalPivot = new THREE.Group(); crystalPivot.position.y = 2.9; group.add(crystalPivot);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xb8f6ff, emissive: 0x4fd8ff, emissiveIntensity: 1.5, flatShading: true, roughness: 0.2, metalness: 0.1 });
  const crystal = new THREE.Mesh(bake([
    [P.oct, mtx([0, 0, 0], null, [0.45, 0.9, 0.45]), 0xffffff],
  ]), crystalMat);
  crystal.castShadow = true;
  crystalPivot.add(crystal);
  const glowSprite = new THREE.Mesh(cgeo('portalGlowDisc', () => new THREE.PlaneGeometry(3.2, 3.2)), new THREE.MeshBasicMaterial({ map: radialTexture(), color: new THREE.Color(0x7fe0ff).multiplyScalar(0.9), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  crystalPivot.add(glowSprite);
  const haloMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffd36a).multiplyScalar(2.2) });
  const halo1 = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.03, 6, 48), haloMat);
  const halo2 = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.022, 6, 48), haloMat);
  crystalPivot.add(halo1, halo2);

  // orbiting golden fish
  const FG = fishGeos();
  const fishes = [];
  for (let i = 0; i < 3; i++) {
    const p = new THREE.Group(); crystalPivot.add(p);
    const f = new THREE.Group(); f.position.set(1.1, 0, 0); f.rotation.y = -Math.PI / 2; p.add(f);
    f.add(new THREE.Mesh(FG.body, fishMaterial()));
    const tp = new THREE.Group(); tp.position.x = -0.22; f.add(tp); tp.add(new THREE.Mesh(FG.tail, fishMaterial()));
    f.scale.setScalar(0.9);
    fishes.push({ p, tp, i });
  }

  let act = 0, swirlT = 0, clock = 0;
  function update(dt, time, opts) {
    dt = Math.min(dt || 0, 0.1);
    clock += dt;
    const t = time === undefined ? clock : time;
    const active = !!(opts && opts.active);
    act = smoothTo(act, active ? 1 : 0, 3, dt);
    const speed = 1 + 2.2 * act;
    swirlT += dt * speed;
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
    const I = 0.85 + 0.15 * pulse + 1.3 * act;
    swirlMat.uniforms.uTime.value = swirlT;
    swirlMat.uniforms.uIntensity.value = I;
    runeOuter.rotation.y = swirlT * 0.12;
    runeInner.rotation.y = -swirlT * 0.25;
    runeMat.color.copy(runeCol).multiplyScalar(1.3 + 0.5 * pulse + 1.5 * act);
    beamMat.uniforms.uTime.value = t;
    beamMat.uniforms.uIntensity.value = 0.7 + 0.2 * pulse + 1.4 * act;
    colMat.uniforms.uTime.value = t;
    colMat.uniforms.uIntensity.value = 0.5 + 0.15 * pulse + 1.2 * act;
    for (let i = 0; i < beams.length; i++) {
      const s = 1 + 0.6 * act + 0.08 * Math.sin(t * 3 + i);
      beams[i].scale.set(1 + act, s, 1 + act);
    }
    crystalPivot.position.y = 2.9 + Math.sin(t * 1.6) * 0.15 + 0.3 * act;
    crystal.rotation.y = swirlT * 0.9;
    crystalMat.emissiveIntensity = 1.3 + 0.4 * pulse + 1.8 * act;
    glowSprite.quaternion.identity();
    glowSprite.rotation.x = -0.96; // face the angled camera
    glowSprite.scale.setScalar(1 + 0.15 * pulse + 0.6 * act);
    halo1.rotation.set(Math.PI / 2 + Math.sin(t * 0.8) * 0.35, swirlT * 0.5, 0);
    halo2.rotation.set(Math.PI / 2 + Math.cos(t * 0.6) * 0.45, -swirlT * 0.4, 0.3);
    for (const f of fishes) {
      f.p.rotation.y = swirlT * 0.9 + (f.i / 3) * TAU_;
      f.p.position.y = Math.sin(t * 2 + f.i * 2) * 0.2;
      f.tp.rotation.y = Math.sin(t * 12 + f.i) * 0.5;
    }
  }
  update(0, 0, {});
  return { group, update };
}

// ---------------------------------------------------------------- small helpers

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function hash2(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

function makeTracker() {
  const geos = new Set(), mats = new Set(), texs = new Set();
  return {
    g(x) { geos.add(x); return x; },
    m(x) { mats.add(x); return x; },
    t(x) { texs.add(x); return x; },
    dispose() {
      geos.forEach((x) => x.dispose()); mats.forEach((x) => x.dispose()); texs.forEach((x) => x.dispose());
      geos.clear(); mats.clear(); texs.clear();
    },
  };
}

function canvasTex(size, draw, { srgb = true, repeat = true } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

// draw fn at (x,y) plus wrapped copies near edges so the texture tiles seamlessly
function wrapDraw(size, x, y, m, fn) {
  for (let dx = -size; dx <= size; dx += size) {
    for (let dy = -size; dy <= size; dy += size) {
      const px = x + dx, py = y + dy;
      if (px > -m && px < size + m && py > -m && py < size + m) fn(px, py);
    }
  }
}

function blotches(g, S, rng, n, rMin, rMax, light, dark) {
  for (let i = 0; i < n; i++) {
    const x = rng.range(0, S), y = rng.range(0, S), r = rng.range(rMin, rMax);
    const col = rng.chance(0.5) ? light : dark;
    const rgb = `${col[0]},${col[1]},${col[2]}`;
    wrapDraw(S, x, y, r, (px, py) => {
      const gr = g.createRadialGradient(px, py, 0, px, py, r);
      gr.addColorStop(0, `rgba(${rgb},${col[3]})`); gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill();
    });
  }
}

function makeFloorTextures(style, T) {
  const rng = createRng(hashSeed('floor', style));
  const S = 512;
  let map, emissiveMap = null;
  if (style === 'grass' || style === 'autumn') {
    const autumn = style === 'autumn';
    map = canvasTex(S, (g) => {
      g.fillStyle = autumn ? '#d4cdbf' : '#cfd2cb'; g.fillRect(0, 0, S, S);
      blotches(g, S, rng, 70, 25, 80, [255, 255, 235, 0.22], [60, 70, 30, 0.14]);
      g.lineCap = 'round';
      const blades = autumn ? 1800 : 4200;
      for (let i = 0; i < blades; i++) {
        const x = rng.range(0, S), y = rng.range(0, S), len = rng.range(5, 13);
        const ang = -Math.PI / 2 + rng.range(-0.7, 0.7);
        const v = rng.int(165, 255);
        g.strokeStyle = autumn ? `rgb(${v},${(v * 0.95) | 0},${(v * 0.8) | 0})` : `rgb(${(v * 0.93) | 0},${v},${(v * 0.82) | 0})`;
        g.lineWidth = rng.range(1.2, 2.4);
        wrapDraw(S, x, y, 14, (px, py) => {
          g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len); g.stroke();
        });
      }
      if (autumn) {
        const leafCols = ['rgb(255,170,120)', 'rgb(255,130,100)', 'rgb(255,225,140)', 'rgb(140,110,90)', 'rgb(255,200,150)'];
        for (let i = 0; i < 650; i++) {
          const x = rng.range(0, S), y = rng.range(0, S), rx = rng.range(3, 7), ry = rx * rng.range(0.4, 0.6), rot = rng.range(0, TAU);
          g.fillStyle = rng.pick(leafCols);
          wrapDraw(S, x, y, 8, (px, py) => { g.beginPath(); g.ellipse(px, py, rx, ry, rot, 0, TAU); g.fill(); });
        }
      } else {
        // a few tiny clover dots
        for (let i = 0; i < 300; i++) {
          const x = rng.range(0, S), y = rng.range(0, S);
          g.fillStyle = `rgba(255,255,230,${rng.range(0.25, 0.6)})`;
          wrapDraw(S, x, y, 3, (px, py) => { g.beginPath(); g.arc(px, py, rng.range(1, 2.2), 0, TAU); g.fill(); });
        }
      }
    });
  } else if (style === 'snow') {
    map = canvasTex(S, (g) => {
      g.fillStyle = '#f0f2f6'; g.fillRect(0, 0, S, S);
      blotches(g, S, rng, 50, 40, 120, [255, 255, 255, 0.35], [150, 175, 225, 0.14]);
      for (let i = 0; i < 700; i++) {
        const x = rng.range(0, S), y = rng.range(0, S), r = rng.range(0.8, 2.2);
        g.fillStyle = `rgba(160,185,230,${rng.range(0.05, 0.12)})`;
        wrapDraw(S, x, y, 6, (px, py) => { g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); });
      }
    });
    emissiveMap = canvasTex(S, (g) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
      for (let i = 0; i < 260; i++) {
        const x = rng.range(0, S), y = rng.range(0, S), v = rng.int(120, 255);
        g.fillStyle = `rgb(${v},${v},${v})`;
        const s = rng.chance(0.15) ? 2 : 1;
        g.fillRect(x, y, s, s);
      }
    });
  } else {
    // neon: dark tiles + glowing grid emissive map
    const N = 4, ts = S / N;
    map = canvasTex(S, (g) => {
      g.fillStyle = '#6a6a80'; g.fillRect(0, 0, S, S);
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const v = rng.int(185, 235);
        g.fillStyle = `rgb(${v},${v},${(v * 1.04) | 0})`;
        g.fillRect(i * ts + 3, j * ts + 3, ts - 6, ts - 6);
        g.fillStyle = 'rgba(255,255,255,0.08)';
        g.fillRect(i * ts + 3, j * ts + 3, ts - 6, (ts - 6) * 0.4);
      }
    });
    emissiveMap = canvasTex(S, (g) => {
      g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
      for (const [w, a] of [[8, 0.18], [3, 0.55], [1.2, 1]]) {
        g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = w;
        for (let i = 0; i <= N; i++) {
          g.beginPath(); g.moveTo(i * ts, 0); g.lineTo(i * ts, S); g.stroke();
          g.beginPath(); g.moveTo(0, i * ts); g.lineTo(S, i * ts); g.stroke();
        }
      }
    });
  }
  T.t(map); if (emissiveMap) T.t(emissiveMap);
  return { map, emissiveMap };
}

function makePlazaTexture(T) {
  const rng = createRng(777);
  const S = 512, C = S / 2;
  return T.t(canvasTex(S, (g) => {
    g.fillStyle = '#8f8f8f'; g.fillRect(0, 0, S, S);
    const stone = (r0, r1, a0, a1) => {
      const v = rng.int(205, 248);
      g.fillStyle = `rgb(${v},${v},${(v * 0.98) | 0})`;
      g.beginPath(); g.arc(C, C, r1, a0, a1); g.arc(C, C, r0, a1, a0, true); g.closePath(); g.fill();
    };
    g.fillStyle = '#f4f4f4'; g.beginPath(); g.arc(C, C, 38, 0, TAU); g.fill();
    // little star inlay
    g.fillStyle = '#c8c8c8'; g.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * TAU, r = k % 2 ? 12 : 30;
      g.lineTo(C + Math.cos(a) * r, C + Math.sin(a) * r);
    }
    g.closePath(); g.fill();
    let r = 42;
    while (r < 256) {
      const w = 34, rm = r + w / 2;
      const n = Math.max(6, Math.round(TAU * rm / 46));
      const off = rng.range(0, TAU);
      const gapA = 2.2 / rm;
      for (let k = 0; k < n; k++) {
        const a0 = off + k / n * TAU + gapA, a1 = off + (k + 1) / n * TAU - gapA;
        stone(r, r + w - 2.5, a0, a1);
      }
      r += w;
    }
    // edge darkening near the wall
    const gr = g.createRadialGradient(C, C, 190, C, C, 256);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.4)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
  }, { repeat: false }));
}

function makeWallTexture(style, T) {
  const rng = createRng(hashSeed('wall', style));
  const S = 256;
  return T.t(canvasTex(S, (g) => {
    if (style === 'hedge') {
      g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, S, S);
      for (let i = 0; i < 1500; i++) {
        const x = rng.range(0, S), y = rng.range(0, S), rx = rng.range(4, 9), ry = rx * rng.range(0.45, 0.7), rot = rng.range(0, TAU);
        const v = rng.int(150, 255);
        g.fillStyle = `rgb(${v},${v},${(v * 0.92) | 0})`;
        wrapDraw(S, x, y, 10, (px, py) => { g.beginPath(); g.ellipse(px, py, rx, ry, rot, 0, TAU); g.fill(); });
      }
      for (let i = 0; i < 260; i++) {
        const x = rng.range(0, S), y = rng.range(0, S);
        g.fillStyle = 'rgba(40,40,40,0.35)';
        wrapDraw(S, x, y, 3, (px, py) => { g.beginPath(); g.arc(px, py, rng.range(1, 2.5), 0, TAU); g.fill(); });
      }
    } else if (style === 'stone') {
      g.fillStyle = '#909090'; g.fillRect(0, 0, S, S);
      const bh = 32, bw = 64;
      for (let row = 0; row < S / bh; row++) {
        const off = (row % 2) * bw / 2;
        for (let k = -1; k < S / bw + 1; k++) {
          const x = k * bw + off, y = row * bh, v = rng.int(190, 240);
          g.fillStyle = `rgb(${v},${v},${Math.min(255, v + 6)})`;
          wrapDraw(S, x, y, bw, (px, py) => g.fillRect(px + 2, py + 2, bw - 4, bh - 4));
          g.fillStyle = 'rgba(255,255,255,0.18)';
          wrapDraw(S, x, y, bw, (px, py) => g.fillRect(px + 2, py + 2, bw - 4, 4));
        }
      }
      for (let i = 0; i < 500; i++) {
        g.fillStyle = `rgba(60,60,70,${rng.range(0.05, 0.2)})`;
        g.fillRect(rng.range(0, S), rng.range(0, S), 2, 2);
      }
    } else {
      g.fillStyle = '#c8c8d8'; g.fillRect(0, 0, S, S);
      g.fillStyle = '#7a7a90';
      g.fillRect(0, 0, 4, S); g.fillRect(S / 2, 0, 4, S);
      g.fillStyle = 'rgba(255,255,255,0.15)';
      g.fillRect(6, 0, 10, S); g.fillRect(S / 2 + 6, 0, 10, S);
      for (let i = 0; i < 8; i++) {
        g.fillStyle = '#9a9ab0';
        g.beginPath(); g.arc(S / 4 + (i % 2) * S / 2, (i * 37) % S + 10, 3, 0, TAU); g.fill();
      }
    }
  }));
}

function makeGlowTexture(T) {
  return T.t(canvasTex(128, (g, S) => {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.45)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');

function makeChevronTexture(T) {
  return T.t(canvasTex(128, (g, S) => {
    g.clearRect(0, 0, S, S);
    g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 13;
    for (const ox of [30, 66]) {
      g.globalAlpha = ox === 30 ? 0.6 : 1;
      g.beginPath(); g.moveTo(ox, 28); g.lineTo(ox + 30, 64); g.lineTo(ox, 100); g.stroke();

function makeSpriteTexture(kind, T) {
  return T.t(canvasTex(64, (g, S) => {
    if (kind === 'leaf') {
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(S / 2, S / 2, S * 0.42, S * 0.2, 0.7, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(S * 0.2, S * 0.75); g.lineTo(S * 0.8, S * 0.25); g.stroke();
    } else {
      const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      gr.addColorStop(0, 'rgba(255,255,255,1)');

      g.fillStyle = gr; g.fillRect(0, 0, S, S);
    }

// Make a MeshStandardMaterial's emissive get multiplied by vertex / instance color.
function emissiveByColor(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n#if defined( USE_COLOR ) || defined( USE_INSTANCING_COLOR )\n\ttotalEmissiveRadiance *= vColor.rgb;\n#endif'
    );
  };
  mat.customProgramCacheKey = () => 'emissiveByColor';
  return mat;
}

// Merge geometries (position + normal [+ color]) into one non-indexed geometry. Disposes inputs.
function mergeGeos(geos) {
  const parts = geos.map((g) => (g.index ? g.toNonIndexed() : g));
  let total = 0;
  for (const p of parts) total += p.attributes.position.count;
  const hasColor = parts.every((p) => p.attributes.color);
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
  const col = hasColor ? new Float32Array(total * 3) : null;
  let o = 0;
  for (const p of parts) {
    if (!p.attributes.normal) p.computeVertexNormals();
    pos.set(p.attributes.position.array, o * 3);
    nor.set(p.attributes.normal.array, o * 3);
    if (col) col.set(p.attributes.color.array, o * 3);
    o += p.attributes.position.count;
  }
  for (const g of geos) g.dispose();
  for (const p of parts) p.dispose();
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  if (col) out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}

function place(geo, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
    new THREE.Vector3(sx, sy, sz)
  );
  geo.applyMatrix4(m);
  return geo;
}

function paint(geo, color) {
  const n = geo.attributes.position.count, c = new THREE.Color(color), arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}

function makeInstanced(geo, mat, items, { cast = false, receive = false } = {}) {
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, items.length));
  mesh.count = items.length;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const p = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    p.set(it.x, it.y || 0, it.z);
    e.set(it.rx || 0, it.ry || 0, it.rz || 0);
    q.setFromEuler(e);
    s.set(it.sx ?? it.s ?? 1, it.sy ?? it.s ?? 1, it.sz ?? it.s ?? 1);
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
    if (it.color) mesh.setColorAt(i, it.color);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

// ---------------------------------------------------------------- swept wall geometry

function arcPath(R, a0, a1, segLen) {
  const n = Math.max(2, Math.ceil((R * (a1 - a0)) / segLen));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const th = a0 + ((a1 - a0) * i) / n, c = Math.cos(th), s = Math.sin(th);
    pts.push({ x: R * c, z: R * s, tx: -s, tz: c, s: R * th });
  }
  return pts;
}

function linePath(ax, az, bx, bz, segLen) {
  const L = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.ceil(L / segLen));
  const tx = (bx - ax) / L, tz = (bz - az) / L, pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n;
    pts.push({ x: ax + (bx - ax) * f, z: az + (bz - az) * f, tx, tz, s: L * f });
  }
  return pts;
}

// Sweep a CCW (u right/outward, y up) profile along a path. Profile closing edge (last->first)
// is the bottom and is skipped. End caps are fans. Side normal N = (tz, -tx), so T = N x Y.
function sweep(buf, path, profile, colorFn, uvs, caps = true) {
  const P = profile.length;
  const plen = [0];
  for (let k = 1; k < P; k++) plen.push(plen[k - 1] + Math.hypot(profile[k].u - profile[k - 1].u, profile[k].y - profile[k - 1].y));
  const col = new THREE.Color();
  const push = (x, y, z, nx, ny, nz, u, v) => {
    buf.p.push(x, y, z); buf.n.push(nx, ny, nz); buf.uv.push(u, v);
    colorFn(x, y, z, col); buf.c.push(col.r, col.g, col.b);
  };
  const vert = (pt, k, nu, ny) => {
    const nx = pt.tz, nz = -pt.tx, pr = profile[k];
    push(pt.x + nx * pr.u, pr.y, pt.z + nz * pr.u, nx * nu, ny, nz * nu, pt.s * uvs, plen[k] * uvs);
  };
  for (let k = 0; k < P - 1; k++) {
    const du = profile[k + 1].u - profile[k].u, dy = profile[k + 1].y - profile[k].y, L = Math.hypot(du, dy) || 1;
    const nu = dy / L, ny = -du / L;
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      // A=(a,k) B=(b,k) C=(b,k+1) D=(a,k+1); winding A,C,B / A,D,C
      vert(a, k, nu, ny); vert(b, k + 1, nu, ny); vert(b, k, nu, ny);
      vert(a, k, nu, ny); vert(a, k + 1, nu, ny); vert(b, k + 1, nu, ny);
    }
  }
  if (!caps) return;
  const capAt = (pt, sign) => {
    const nx = pt.tz, nz = -pt.tx;
    const V = (k) => {
      const pr = profile[k];
      push(pt.x + nx * pr.u, pr.y, pt.z + nz * pr.u, pt.tx * sign, 0, pt.tz * sign, pr.u * uvs, pr.y * uvs);
    };
    for (let k = 1; k < P - 1; k++) {
      if (sign > 0) { V(0); V(k); V(k + 1); } else { V(0); V(k + 1); V(k); }
    }
  };
  capAt(path[0], -1);
  capAt(path[path.length - 1], 1);
}

function bufToGeo(buf) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(buf.p, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(buf.n, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(buf.uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(buf.c, 3));
  g.computeBoundingSphere();
  return g;
}

function roundedProfile(hw, base, h, steps) {
  const pts = [];
  for (let k = 0; k <= steps; k++) {
    const phi = (k / steps) * Math.PI;
    // squircle-ish: flatter top
    const c = Math.cos(phi), s = Math.sin(phi);
    pts.push({ u: hw * Math.sign(c) * Math.pow(Math.abs(c), 0.8), y: base + h * Math.pow(s, 0.7) });
  }
  return pts;
}

function buildWalls(levelData, theme, T) {
  const H = CFG.WALL_HEIGHT, t = CFG.WALL_THICKNESS, ht = t / 2;
  const style = theme.wallStyle;
  let body, cap;
  if (style === 'stone') {
    body = [{ u: ht + 0.05, y: 0 }, { u: ht, y: H }, { u: -ht, y: H }, { u: -ht - 0.05, y: 0 }];
    cap = roundedProfile(ht + 0.13, H - 0.1, 0.34, 8);
  } else if (style === 'neon') {
    body = [{ u: ht, y: 0 }, { u: ht, y: H }, { u: -ht, y: H }, { u: -ht, y: 0 }];
    cap = [{ u: ht * 0.45, y: H - 0.01 }, { u: ht * 0.45, y: H + 0.07 }, { u: -ht * 0.45, y: H + 0.07 }, { u: -ht * 0.45, y: H - 0.01 }];
  } else {
    body = [{ u: ht, y: 0 }, { u: ht, y: H }, { u: -ht, y: H }, { u: -ht, y: 0 }];
    cap = roundedProfile(ht + 0.08, H - 0.12, 0.3, 6);
  }

  const wallC = new THREE.Color(theme.wall), topC = new THREE.Color(theme.wallTop), accC = new THREE.Color(theme.accent);
  const aoStrength = style === 'stone' ? 0.35 : style === 'neon' ? 0.3 : 0.5;
  const bodyColor = (x, y, z, out) => {
    const n = vnoise(x * 0.7 + y * 0.6, z * 0.7 - y * 0.8), n2 = vnoise(x * 2.7 + 13.1, z * 2.7 + y * 2.1);
    const f = 0.8 + 0.28 * n + 0.12 * n2;
    const ao = 1 - aoStrength + aoStrength * Math.min(1, y / (H * 0.85));
    out.copy(wallC).multiplyScalar(f * ao);
  };
  const capColor = style === 'neon'
    ? (x, y, z, out) => {
      const a = Math.atan2(z, x), r = Math.hypot(x, z);
      const k = 0.5 + 0.5 * Math.sin(a * 2 + r * 0.25);
      out.copy(topC).lerp(accC, k);
    }
    : (x, y, z, out) => {
      const n = vnoise(x * 1.3 + 5.1, z * 1.3 - 2.7);
      out.copy(topC).multiplyScalar((style === 'stone' ? 0.94 : 0.82) + 0.16 * n);
    };

  const bb = { p: [], n: [], uv: [], c: [] }, cb = { p: [], n: [], uv: [], c: [] };
  const SEG = 0.6, UVS = 1 / 1.6;
  for (const arc of levelData.wallArcs) {
    const path = arcPath(arc.radius, arc.a0, arc.a1, SEG);
    const full = arc.a1 - arc.a0 >= TAU - 1e-4;
    sweep(bb, path, body, bodyColor, UVS, !full);
    sweep(cb, path, cap, capColor, UVS, !full);
  }
  for (const rw of levelData.radialWalls) {
    const c = Math.cos(rw.angle), s = Math.sin(rw.angle);
    const r0 = rw.r0 + ht * 0.9, r1 = rw.r1 - ht * 0.9;
    const path = linePath(c * r0, s * r0, c * r1, s * r1, SEG);
    sweep(bb, path, body, bodyColor, UVS);
    sweep(cb, path, cap, capColor, UVS);
  }

  const wallTex = makeWallTexture(style, T);
  const bodyMat = T.m(new THREE.MeshStandardMaterial({ map: wallTex, vertexColors: true, roughness: style === 'neon' ? 0.55 : 0.92, metalness: style === 'neon' ? 0.2 : 0 }));
  let capMat;
  if (style === 'neon') {
    capMat = T.m(emissiveByColor(new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, emissive: 0xffffff, emissiveIntensity: 0.85, roughness: 0.4 })));
  } else if (style === 'stone') {
    capMat = T.m(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75 }));
  } else {
    capMat = T.m(new THREE.MeshStandardMaterial({ map: wallTex, vertexColors: true, roughness: 0.9 }));
  }
  const bodyMesh = new THREE.Mesh(T.g(bufToGeo(bb)), bodyMat);
  bodyMesh.castShadow = bodyMesh.receiveShadow = true;
  const capMesh = new THREE.Mesh(T.g(bufToGeo(cb)), capMat);
  capMesh.castShadow = style !== 'neon';
  capMesh.receiveShadow = true;
  return [bodyMesh, capMesh];
}

// ---------------------------------------------------------------- floors

function buildFloors(levelData, theme, T) {
  const R = levelData.ringRadii, rings = R.length - 1, Rn = R[rings];
  const pos = [], nor = [], uv = [], col = [], idx = [];
  const UVS = 1 / 3.5;
  const addRing = (radii, factors, color) => {
    const r1 = radii[radii.length - 1];
    const n = clamp(Math.ceil((TAU * Math.min(r1, 80)) / 1.0), 64, 400);
    const base = pos.length / 3;
    const c = new THREE.Color(color);
    for (let k = 0; k < radii.length; k++) {
      for (let i = 0; i <= n; i++) {
        const th = (i / n) * TAU, x = radii[k] * Math.cos(th), z = radii[k] * Math.sin(th);
        pos.push(x, 0, z); nor.push(0, 1, 0); uv.push(x * UVS, z * UVS);
        const f = factors[k];
        col.push(c.r * f, c.g * f, c.b * f);
      }
    }
    const W = n + 1;
    for (let k = 0; k < radii.length - 1; k++) {
      for (let i = 0; i < n; i++) {
        const A = base + k * W + i, B = A + 1, C = A + W, D = C + 1;
        idx.push(A, B, C, B, D, C);
      }
    }
  };
  for (let i = 0; i < rings; i++) {
    const r0 = R[i], r1 = R[i + 1];
    addRing([r0, r0 + 0.25, r0 + 0.9, r1 - 0.9, r1 - 0.25, r1], [0.62, 0.78, 1, 1, 0.78, 0.62], i % 2 ? theme.groundAlt : theme.ground);
  }
  addRing([Rn, Rn + 0.3, Rn + 1.2, Rn + 8, Rn + 40, Rn + 150], [0.62, 0.8, 1, 1, 1, 1], theme.outerGround);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  T.g(g);

  const { map, emissiveMap } = makeFloorTextures(theme.floorStyle, T);
  const opts = { map, vertexColors: true, roughness: 0.95, metalness: 0 };
  if (theme.floorStyle === 'snow') Object.assign(opts, { emissiveMap, emissive: 0xffffff, emissiveIntensity: 1.1, roughness: 0.8 });
  if (theme.floorStyle === 'neon') Object.assign(opts, { emissiveMap, emissive: theme.accent, emissiveIntensity: 0.16, roughness: 0.6, metalness: 0.15 });
  const floor = new THREE.Mesh(g, T.m(new THREE.MeshStandardMaterial(opts)));
  floor.receiveShadow = true;

  // center plaza
  const pg = T.g(new THREE.CircleGeometry(R[0] + 0.05, 72));
  pg.rotateX(-Math.PI / 2);
  const pmOpts = { map: makePlazaTexture(T), color: theme.plaza, roughness: 0.85 };
  const plaza = new THREE.Mesh(pg, T.m(new THREE.MeshStandardMaterial(pmOpts)));
  plaza.position.y = 0.005;
  plaza.receiveShadow = true;
  return [floor, plaza];
}

// ---------------------------------------------------------------- lanterns + chevrons

function buildLanterns(levelData, theme, T, rng) {
  const R = levelData.ringRadii, Rn = R[R.length - 1], H = CFG.WALL_HEIGHT;
  const spots = [];
  for (const gap of levelData.gaps) {
    const wr = R[gap.wall];
    for (const side of [-1, 1]) {
      const a = gap.angle + side * (gap.halfAngle + 0.3 / wr);
      spots.push({ a, r: wr });
    }
  }
  const nOuter = Math.max(8, Math.round((TAU * Rn) / 9));
  const off = rng.range(0, TAU);
  for (let k = 0; k < nOuter; k++) spots.push({ a: off + (k / nOuter) * TAU, r: Rn });

  const PH = H + 0.25;
  const pillarGeo = T.g(mergeGeos([
    place(new THREE.BoxGeometry(0.76, 0.18, 0.76), 0, 0.09, 0),
    place(new THREE.BoxGeometry(0.6, PH, 0.6), 0, PH / 2, 0),
    place(new THREE.BoxGeometry(0.74, 0.12, 0.74), 0, PH + 0.02, 0),
    place(new THREE.CylinderGeometry(0.2, 0.12, 0.14, 8), 0, PH + 0.14, 0),
  ]));
  const orbGeo = T.g(new THREE.IcosahedronGeometry(0.21, 2));
  const glowGeo = T.g(new THREE.PlaneGeometry(1, 1)); glowGeo.rotateX(-Math.PI / 2);

  const pillarItems = [], orbItems = [], glowItems = [];
  const pc = new THREE.Color(theme.pillar);
  for (const sp of spots) {
    const x = sp.r * Math.cos(sp.a), z = sp.r * Math.sin(sp.a);
    pillarItems.push({ x, z, ry: -sp.a, color: pc.clone().multiplyScalar(rng.range(0.9, 1.08)) });
    orbItems.push({ x, z, y: PH + 0.36, color: new THREE.Color(1, 1, 1) });
    glowItems.push({ x, z, y: 0.03, s: 4.2, color: new THREE.Color(1, 1, 1) });
  }
  const pillarMat = T.m(new THREE.MeshStandardMaterial({ roughness: 0.85, flatShading: true }));
  const orbMat = T.m(new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const glowTex = makeGlowTexture(T);
  const glowMat = T.m(new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: true }));

  const pillars = makeInstanced(pillarGeo, pillarMat, pillarItems, { cast: true, receive: true });
  const orbs = makeInstanced(orbGeo, orbMat, orbItems);
  const glows = makeInstanced(glowGeo, glowMat, glowItems);
  glows.renderOrder = 1;

  const phases = spots.map(() => rng.range(0, 10));
  const lampC = new THREE.Color(theme.lamp);
  const tmp = new THREE.Color();
  const update = (time) => {
    for (let i = 0; i < spots.length; i++) {
      const ph = phases[i];
      const f = 0.86 + 0.08 * Math.sin(time * 6.3 + ph * 7) + 0.06 * Math.sin(time * 17.1 + ph * 13);
      tmp.copy(lampC).multiplyScalar(theme.lampBoost * f);
      orbs.setColorAt(i, tmp);
      tmp.copy(lampC).multiplyScalar(theme.glowK * f);
      glows.setColorAt(i, tmp);
    }
    if (orbs.instanceColor) orbs.instanceColor.needsUpdate = true;
    if (glows.instanceColor) glows.instanceColor.needsUpdate = true;
  };
  update(0);

  // chevrons: on the outer side of each gap pointing inward
  const chevGeo = T.g(new THREE.PlaneGeometry(1.5, 1.5)); chevGeo.rotateX(-Math.PI / 2);
  const chevItems = [];
  for (const gap of levelData.gaps) {
    const r = R[gap.wall] + 1.5, x = r * Math.cos(gap.angle), z = r * Math.sin(gap.angle);
    chevItems.push({ x, z, y: 0.02, ry: -(gap.angle + Math.PI) });
  }
  const chevMat = T.m(new THREE.MeshBasicMaterial({
    map: makeChevronTexture(T), color: new THREE.Color(theme.chevron).multiplyScalar(theme.wallStyle === 'neon' ? 1.6 : 1),
    transparent: true, opacity: theme.chevronOpacity, depthWrite: false, fog: true,
  }));
  const chevrons = makeInstanced(chevGeo, chevMat, chevItems);
  chevrons.renderOrder = 1;
  const chevUpdate = (time) => { chevMat.opacity = theme.chevronOpacity * (0.75 + 0.25 * Math.sin(time * 2.4)); };

  return { meshes: [pillars, orbs, glows, chevrons], update: (time) => { update(time); chevUpdate(time); } };
}

// ---------------------------------------------------------------- decor

function buildDecor(levelData, theme, ti, T, rng) {
  const R = levelData.ringRadii, rings = R.length - 1, R0 = R[0], Rn = R[rings];
  const ht = CFG.WALL_THICKNESS / 2;
  const radialWalls = levelData.radialWalls || [];
  const meshes = [];

  const sampleCorridor = (margin) => {
    for (let tries = 0; tries < 24; tries++) {
      const r = Math.sqrt(rng.range(R0 * R0, Rn * Rn)), a = rng.range(0, TAU);
      let ok = true;
      for (const rr of R) if (Math.abs(r - rr) < ht + margin) { ok = false; break; }
      if (ok) {
        for (const w of radialWalls) {
          if (r < w.r0 - 0.5 || r > w.r1 + 0.5) continue;
          if (Math.abs(angleDiff(a, w.angle)) * r < ht + margin) { ok = false; break; }
        }
      }
      if (ok) return { x: r * Math.cos(a), z: r * Math.sin(a), r, a };
    }
    return null;
  };
  const sampleOuter = (lo, hi) => {
    const r = Math.sqrt(rng.range((Rn + lo) ** 2, (Rn + hi) ** 2)), a = rng.range(0, TAU);
    return { x: r * Math.cos(a), z: r * Math.sin(a), r, a };
  };
  const corridorArea = Math.PI * (Rn * Rn - R0 * R0);
  const outerArea = Math.PI * ((Rn + 26) ** 2 - (Rn + 2.5) ** 2);
  const jitterColor = (hex, b = 0.12) => new THREE.Color(hex).multiplyScalar(rng.range(1 - b, 1 + b));

  // ---- trees
  const pine = ti === 2;
  const trunkGeo = T.g(place(new THREE.CylinderGeometry(0.13, 0.2, pine ? 1.0 : 1.6, 6), 0, pine ? 0.5 : 0.8, 0));
  const crownGeo = T.g(pine
    ? mergeGeos([
      place(new THREE.ConeGeometry(1.05, 1.3, 7), 0, 1.3, 0),
      place(new THREE.ConeGeometry(0.82, 1.1, 7), 0, 2.0, 0, 1, 1, 1, 0, 0.4, 0),
      place(new THREE.ConeGeometry(0.56, 0.9, 7), 0, 2.65, 0, 1, 1, 1, 0, 0.8, 0),
    ])
    : mergeGeos([
      place(new THREE.IcosahedronGeometry(0.95, 1), 0, 2.0, 0),
      place(new THREE.IcosahedronGeometry(0.72, 1), 0.6, 1.7, 0.25),
      place(new THREE.IcosahedronGeometry(0.66, 1), -0.5, 1.75, -0.3),
      place(new THREE.IcosahedronGeometry(0.6, 1), 0.1, 2.55, 0.1),
    ]));
  const trunkMat = T.m(new THREE.MeshStandardMaterial({ color: theme.trunk, roughness: 1, flatShading: true }));
  const crownMat = T.m(new THREE.MeshStandardMaterial({ roughness: 0.85, flatShading: true }));
  if (theme.crownEmissive > 0) { crownMat.emissive.set(0xffffff); crownMat.emissiveIntensity = theme.crownEmissive; emissiveByColor(crownMat); }
  const trees = [];
  const nTrees = Math.round(outerArea * 0.017);
  for (let i = 0; i < nTrees; i++) {
    const p = sampleOuter(2.8, 26), s = rng.range(0.8, 1.55);
    trees.push({ x: p.x, z: p.z, s, ry: rng.range(0, TAU), color: jitterColor(rng.pick(theme.crowns)) });
  }
  meshes.push(makeInstanced(trunkGeo, trunkMat, trees.map((t) => ({ ...t, color: null })), { cast: true }));
  meshes.push(makeInstanced(crownGeo, crownMat, trees, { cast: true, receive: true }));

  // ---- bushes (hug the outer wall + scattered)
  const bushGeo = T.g(mergeGeos([
    place(new THREE.IcosahedronGeometry(0.5, 1), 0, 0.32, 0),
    place(new THREE.IcosahedronGeometry(0.38, 1), 0.42, 0.25, 0.1),
    place(new THREE.IcosahedronGeometry(0.36, 1), -0.38, 0.24, -0.12),
  ]));
  const bushMat = T.m(new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true }));
  if (theme.crownEmissive > 0) { bushMat.emissive.set(0xffffff); bushMat.emissiveIntensity = theme.crownEmissive; emissiveByColor(bushMat); }
  const bushes = [];
  const nHug = Math.round((TAU * Rn) / 2.6);
  for (let i = 0; i < nHug; i++) {
    const a = (i / nHug) * TAU + rng.range(-0.02, 0.02), r = Rn + ht + rng.range(0.45, 1.0);
    if (rng.chance(0.3)) continue;
    bushes.push({ x: r * Math.cos(a), z: r * Math.sin(a), s: rng.range(0.8, 1.3), ry: rng.range(0, TAU), color: jitterColor(rng.pick(theme.crowns), 0.18).multiplyScalar(0.85) });
  }
  const nBush = Math.round(outerArea * 0.008);
  for (let i = 0; i < nBush; i++) {
    const p = sampleOuter(2, 26);
    bushes.push({ x: p.x, z: p.z, s: rng.range(0.7, 1.4), ry: rng.range(0, TAU), color: jitterColor(rng.pick(theme.crowns), 0.18) });
  }
  meshes.push(makeInstanced(bushGeo, bushMat, bushes, { cast: true, receive: true }));

  // ---- rocks
  const rockGeo = T.g(new THREE.DodecahedronGeometry(0.5, 0));
  const rockMat = T.m(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true }));
  const rocks = [];
  const nRocks = Math.round(outerArea * 0.006);
  for (let i = 0; i < nRocks; i++) {
    const p = sampleOuter(2, 26), s = rng.range(0.5, 1.6);
    rocks.push({ x: p.x, z: p.z, y: 0.12 * s, sx: s * rng.range(0.8, 1.3), sy: s * rng.range(0.45, 0.8), sz: s, ry: rng.range(0, TAU), rx: rng.range(-0.2, 0.2), color: jitterColor(theme.rock, 0.12) });
  }
  // pebbles in corridors (same mesh)
  const nPeb = Math.round(corridorArea * 0.025);
  for (let i = 0; i < nPeb; i++) {
    const p = sampleCorridor(0.4); if (!p) continue;
    const s = rng.range(0.12, 0.26);
    rocks.push({ x: p.x, z: p.z, y: 0.03, sx: s * 1.3, sy: s * 0.5, sz: s, ry: rng.range(0, TAU), color: jitterColor(theme.rock, 0.15) });
  }
  meshes.push(makeInstanced(rockGeo, rockMat, rocks, { cast: true, receive: true }));

  // ---- grass tufts (not in snow)
  if (ti !== 2) {
    const blades = [];
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * TAU;
      blades.push(place(new THREE.ConeGeometry(0.05, 0.38, 3), Math.cos(a) * 0.06, 0.17, Math.sin(a) * 0.06, 1, rng.range(0.7, 1.2), 1, Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35));
    }
    const tuftGeo = T.g(mergeGeos(blades));
    const tuftMat = T.m(new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true }));
    const tufts = [];
    const nIn = Math.round(corridorArea * 0.07), nOut = Math.round(outerArea * 0.03);
    for (let i = 0; i < nIn; i++) {
      const p = sampleCorridor(0.3); if (!p) continue;
      tufts.push({ x: p.x, z: p.z, s: rng.range(0.7, 1.3), ry: rng.range(0, TAU), color: jitterColor(theme.tuft, 0.18) });
    }
    for (let i = 0; i < nOut; i++) {
      const p = sampleOuter(1.2, 26);
      tufts.push({ x: p.x, z: p.z, s: rng.range(0.9, 1.6), ry: rng.range(0, TAU), color: jitterColor(theme.tuft, 0.18) });
    }
    meshes.push(makeInstanced(tuftGeo, tuftMat, tufts));
  }

  // ---- theme-specific small things in corridors
  const clusters = (count, per, spread, margin, make) => {
    const out = [];
    for (let i = 0; i < count; i++) {
      const p = sampleCorridor(margin); if (!p) continue;
      const n = rng.int(per[0], per[1]);
      for (let k = 0; k < n; k++) out.push(make(p.x + rng.range(-spread, spread), p.z + rng.range(-spread, spread)));
    }
    return out;
  };

  if (ti === 0) {
    const petals = [];
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * TAU;
      petals.push(place(new THREE.OctahedronGeometry(0.075, 0), Math.cos(a) * 0.08, 0.1, Math.sin(a) * 0.08, 1, 0.35, 0.65, 0, -a, 0));
    }
    petals.push(paint(place(new THREE.OctahedronGeometry(0.055, 0), 0, 0.12, 0, 1, 0.6, 1), 0xffd040));
    for (let k = 0; k < 5; k++) paint(petals[k], 0xffffff);
    const flowerGeo = T.g(mergeGeos(petals));
    const flowerMat = T.m(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7, flatShading: true }));
    const flowers = clusters(Math.round(corridorArea * 0.035), [2, 5], 0.45, 0.6, (x, z) => ({ x, z, s: rng.range(0.9, 1.4), ry: rng.range(0, TAU), color: new THREE.Color(rng.pick(theme.smalls)) }));
    // a few around the outside too
    for (let i = 0; i < outerArea * 0.02; i++) {
      const p = sampleOuter(1.2, 20);
      flowers.push({ x: p.x, z: p.z, s: rng.range(1, 1.6), ry: rng.range(0, TAU), color: new THREE.Color(rng.pick(theme.smalls)) });
    }
    meshes.push(makeInstanced(flowerGeo, flowerMat, flowers));
  } else if (ti === 1) {
    const leafShape = new THREE.Shape();
    leafShape.moveTo(-0.5, 0); leafShape.quadraticCurveTo(0, 0.32, 0.5, 0); leafShape.quadraticCurveTo(0, -0.32, -0.5, 0);
    const leafGeo = T.g(new THREE.ShapeGeometry(leafShape, 3)); leafGeo.rotateX(-Math.PI / 2);
    const leafMat = T.m(new THREE.MeshStandardMaterial({ roughness: 0.8, side: THREE.DoubleSide }));
    const leaves = clusters(Math.round(corridorArea * 0.06), [3, 7], 0.8, 0.5, (x, z) => ({ x, z, y: 0.015 + rng.range(0, 0.02), s: rng.range(0.22, 0.38), ry: rng.range(0, TAU), rx: rng.range(-0.15, 0.15), color: jitterColor(rng.pick(theme.smalls), 0.15) }));
    for (let i = 0; i < outerArea * 0.12; i++) {
      const p = sampleOuter(1, 26);
      leaves.push({ x: p.x, z: p.z, y: 0.02, s: rng.range(0.25, 0.42), ry: rng.range(0, TAU), color: jitterColor(rng.pick(theme.smalls), 0.15) });
    }
    meshes.push(makeInstanced(leafGeo, leafMat, leaves));
    // pumpkins outside (cute)
    const pumpGeo = T.g(mergeGeos([
      paint(place(new THREE.SphereGeometry(0.4, 10, 6), 0, 0.3, 0, 1, 0.75, 1), 0xffffff),
      paint(place(new THREE.CylinderGeometry(0.04, 0.06, 0.18, 5), 0, 0.62, 0), 0x3b5a20),
    ]));
    const pumpMat = T.m(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, flatShading: true }));
    const pumps = [];
    for (let i = 0; i < Math.round(TAU * Rn / 7); i++) {
      const p = sampleOuter(1.0, 6);
      pumps.push({ x: p.x, z: p.z, s: rng.range(0.6, 1.2), ry: rng.range(0, TAU), color: jitterColor(0xf08a24, 0.1) });
    }
    meshes.push(makeInstanced(pumpGeo, pumpMat, pumps, { cast: true }));
  } else if (ti === 2) {

// ---------------------------------------------------------------- particles

function buildParticles(theme, rng, radius, T) {
  const kind = theme.particles;
  const area = Math.PI * radius * radius;
  const count = Math.round(clamp(area * 0.1, 300, 1300));
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const base = new Float32Array(count * 5); // bx, bz, by, phase, speed
  const c = new THREE.Color();
  let palette, H, size, additive, sprite;
  if (kind === 'pollen') { palette = [0xfff6c0, 0xffffff, 0xfff0a0]; H = 4; size = 0.16; additive = true; sprite = 'dot'; }
  else if (kind === 'leaves') { palette = theme.crowns; H = 11; size = 0.42; additive = false; sprite = 'leaf'; }
  else if (kind === 'snow') { palette = [0xffffff, 0xf0f6ff]; H = 12; size = 0.2; additive = false; sprite = 'snow'; }
  else { palette = [theme.accent, theme.wallTop, 0xb68cff]; H = 7; size = 0.26; additive = true; sprite = 'dot'; }
  const bright = kind === 'motes' ? 1.8 : kind === 'pollen' ? 1.1 : 1;
  for (let i = 0; i < count; i++) {
    const r = radius * Math.sqrt(rng.next()), a = rng.range(0, TAU);
    base[i * 5] = r * Math.cos(a); base[i * 5 + 1] = r * Math.sin(a);
    base[i * 5 + 2] = kind === 'pollen' ? rng.range(0.4, 3.5) : rng.range(0, H);
    base[i * 5 + 3] = rng.range(0, 100);
    base[i * 5 + 4] = kind === 'leaves' ? rng.range(0.6, 1.2) : kind === 'snow' ? rng.range(0.7, 1.5) : rng.range(0.25, 0.6);
    c.set(rng.pick(palette)).multiplyScalar(bright * rng.range(0.85, 1.1));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const g = T.g(new THREE.BufferGeometry());
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = T.m(new THREE.PointsMaterial({
    size, map: makeSpriteTexture(sprite, T), vertexColors: true, transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, sizeAttenuation: true, opacity: kind === 'pollen' ? 0.75 : 1,
  }));
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  const update = (t) => {
    for (let i = 0; i < count; i++) {
      const o = i * 5, bx = base[o], bz = base[o + 1], by = base[o + 2], ph = base[o + 3], sp = base[o + 4];
      let x, y, z;
      if (kind === 'pollen') {
        x = bx + Math.sin(t * 0.3 * sp + ph) * 1.6; z = bz + Math.cos(t * 0.27 * sp + ph * 1.3) * 1.6;
        y = by + Math.sin(t * 0.8 * sp + ph * 2) * 0.35;
      } else if (kind === 'motes') {
        y = (by + t * sp) % H + 0.2;
        x = bx + Math.sin(t * 0.5 + ph) * 0.8; z = bz + Math.cos(t * 0.43 + ph * 1.7) * 0.8;
      } else {
        const fall = ((by - t * sp) % H + H) % H;
        y = fall + 0.05;
        const sway = kind === 'leaves' ? 1.1 : 0.45;
        x = bx + Math.sin(t * 1.2 * sp + ph) * sway + (H - fall) * 0.25;
        z = bz + Math.cos(t * 0.9 * sp + ph * 1.3) * sway;
      }
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    }
    g.attributes.position.needsUpdate = true;
  };
  update(0);
  return { points: pts, update };
}

// ---------------------------------------------------------------- public API

function buildWorld(scene, levelData) {
  const T = makeTracker();
  const ti = (((levelData.theme ?? ((levelData.level || 1) - 1)) % 4) + 4) % 4;
  const theme = THEMES[ti];
  const rng = createRng(hashSeed(levelData.seed ?? 1, levelData.level ?? 1, 'world'));
  const group = new THREE.Group();
  group.name = 'world';

  for (const m of buildFloors(levelData, theme, T)) group.add(m);
  for (const m of buildWalls(levelData, theme, T)) group.add(m);
  const lanterns = buildLanterns(levelData, theme, T, rng);
  for (const m of lanterns.meshes) group.add(m);
  for (const m of buildDecor(levelData, theme, ti, T, rng)) group.add(m);
  const parts = buildParticles(theme, rng, levelData.outerRadius + 14, T);
  group.add(parts.points);

  scene.add(group);

  let disposed = false;
  return {
    group,
    theme: ti,
    update(dt, time) {
      lanterns.update(time);
      parts.update(time);
    },
    dispose() {
      if (disposed) return;
      disposed = true;
      if (group.parent) group.parent.remove(group);
      T.dispose();
    },
  };
}

function setupLighting(scene) {
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 2);
  const EXT = 30, MAP = 2048, DIST = 60;
  sun.castShadow = true;
  sun.shadow.mapSize.set(MAP, MAP);
  const sc = sun.shadow.camera;
  sc.left = -EXT; sc.right = EXT; sc.top = EXT; sc.bottom = -EXT;
  sc.near = 1; sc.far = DIST + 60;
  sc.updateProjectionMatrix();
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 0.04;
  sun.shadow.radius = 4;
  scene.add(sun);
  scene.add(sun.target);

  // light comes from behind-left (screen up/left); shadows fall toward the viewer/right
  const dir = new THREE.Vector3(-0.45, 1, -0.38).normalize();
  // shadow camera basis (lookAt with up = +Y): z = dir, x = up × z, y = z × x
  const ax = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
  const ay = new THREE.Vector3().crossVectors(dir, ax).normalize();
  const texel = (EXT * 2) / MAP;
  const F = new THREE.Vector3(), out = new THREE.Vector3();

  const bg = new THREE.Color();
  const fog = new THREE.Fog(0xffffff, 40, 120);
  scene.fog = fog;
  scene.background = bg;

  function setTheme(theme) {
    const t = THEMES[(((theme | 0) % 4) + 4) % 4];
    bg.set(t.sky);
    fog.color.set(t.fog); fog.near = t.fogNear; fog.far = t.fogFar;
    scene.fog = fog; scene.background = bg;
    hemi.color.set(t.hemiSky); hemi.groundColor.set(t.hemiGround); hemi.intensity = t.hemiIntensity;
    sun.color.set(t.sunColor); sun.intensity = t.sunIntensity;
  }
  setTheme(0);

  function update(dt, time, focusX = 0, focusZ = 0) {
    F.set(focusX, 0, focusZ);
    const fx = Math.round(F.dot(ax) / texel) * texel;
    const fy = Math.round(F.dot(ay) / texel) * texel;
    const fz = F.dot(dir);
    out.copy(ax).multiplyScalar(fx).addScaledVector(ay, fy).addScaledVector(dir, fz);
    sun.target.position.copy(out);
    sun.position.copy(out).addScaledVector(dir, DIST);
    sun.target.updateMatrixWorld();
    sun.updateMatrixWorld();
  }
  update(0, 0, 0, 0);

  return { update, setTheme, hemi, sun };
}

return { THEMES, buildWorld, setupLighting };

// ===== effects.js =====
const { createEffects } = (() => {
// effects.js — pooled particle / shockwave / beam / floating-text effects.
// Notes on interpretation:
//  - Effects never call shake() themselves; the game decides how much trauma each event adds.
//  - getShakeOffset() returns a reused object (do not keep a reference across frames).
//  - Colors may be a hex number, CSS string or THREE.Color.
//  - burst(): spread 0..1 = cone half-angle as a fraction of PI around +Y (1 = full sphere). gravity is
//    signed (negative pulls down). size = world-unit diameter.

// ---------- particle record layout (struct-of-floats, stride S) ----------
const PX = 0, PY = 1, PZ = 2, VX = 3, VY = 4, VZ = 5, AGE = 6, LIFE = 7, S0 = 8, S1 = 9,
  GRAV = 10, DRAG = 11, CR = 12, CG = 13, CB = 14, A0 = 15, ROT = 16, SPIN = 17, PH = 18, FREQ = 19,
  SHAPE = 20, OX = 21, OZ = 22, OMEGA = 23;
const S = 24;
const SHAPE_ROUND = 0, SHAPE_TWINKLE = 1, SHAPE_RECT = 2;

const TAU = Math.PI * 2;
const rand = Math.random;
const rr = (a, b) => a + (b - a) * rand();

const P_VERT = /* glsl */`
attribute vec3 aColor;
attribute vec4 aParams;
uniform float uScale;
varying vec3 vColor;
varying float vAlpha;
varying vec2 vRot;
varying float vSquash;
void main() {
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  float px = aParams.x * uScale / max(-mv.z, 0.05);
  vAlpha = aParams.y * clamp(px, 0.0, 1.0);
  gl_PointSize = clamp(px, 1.0, 256.0);
  vColor = aColor;
  vRot = vec2(cos(aParams.z), sin(aParams.z));
  vSquash = aParams.w;
}`;

const P_FRAG = /* glsl */`
uniform float uCore;
varying vec3 vColor;
varying float vAlpha;
varying vec2 vRot;
varying float vSquash;
void main() {
  vec2 p = gl_PointCoord - 0.5;
  float a;
  vec3 c;
  if (vSquash > 0.0) {
    vec2 q = vec2(vRot.x * p.x - vRot.y * p.y, vRot.y * p.x + vRot.x * p.y);
    float hy = 0.22 * vSquash + 0.025;
    float ex = 1.0 - smoothstep(0.40, 0.46, abs(q.x));
    float ey = 1.0 - smoothstep(hy - 0.035, hy, abs(q.y));
    a = ex * ey;
    c = vColor * (0.5 + 0.5 * vSquash);
  } else {
    float d = length(p) * 2.0;
    if (d > 1.0) discard;
    float soft = 1.0 - d;
    soft *= soft;
    float core = max(1.0 - d * 2.2, 0.0);
    a = soft + core * 0.5 * uCore;
    c = vColor + vec3(core * core * uCore);
  }
  a *= vAlpha;
  if (a < 0.003) discard;
  gl_FragColor = vec4(c, a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const RING_VERT = /* glsl */`
varying float vR;
void main() {
  vR = length(position.xy);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const RING_FRAG = /* glsl */`
uniform vec3 uColor;
uniform float uOpacity;
uniform float uInner;
varying float vR;
void main() {
  float t = (vR - uInner) / (1.0 - uInner);
  if (t < 0.0) discard;
  float a = t * t * (1.0 - smoothstep(0.8, 1.0, t));
  gl_FragColor = vec4(uColor * (1.0 + a), a * uOpacity);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const BEAM_VERT = /* glsl */`
varying vec2 vUv;
varying float vFres;
void main() {
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vec3 n = normalize(normalMatrix * normal);
  vFres = abs(dot(n, normalize(-mv.xyz)));
  gl_Position = projectionMatrix * mv;
}`;
const BEAM_FRAG = /* glsl */`
uniform vec3 uColor;
uniform float uOpacity;
uniform float uTime;
varying vec2 vUv;
varying float vFres;
void main() {
  float h = vUv.y;
  float fall = pow(1.0 - h, 1.4);
  float stripes = 0.72 + 0.28 * sin(h * 28.0 - uTime * 11.0);
  float core = pow(vFres, 1.6);
  float a = fall * stripes * (0.15 + 0.85 * core) * uOpacity;
  gl_FragColor = vec4(uColor * (0.8 + core * 0.5), a);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const CONFETTI_COLORS = [0xff5c8a, 0xffd23f, 0x3ee08f, 0x4cc9ff, 0xb388ff, 0xff8c42, 0xffffff];

function createEffects(scene) {
  const tmpColor = new THREE.Color();
  const tmpV2 = new THREE.Vector2();
  const scaleUniform = { value: 800 };
  let time = 0;

  // ---------------------------------------------------------------- particle pools
  function makePool(max, blending, core, renderOrder) {
    const pos = new Float32Array(max * 3);
    const col = new Float32Array(max * 3);
    const prm = new Float32Array(max * 4);
    const geo = new THREE.BufferGeometry();
    const aPos = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
    const aCol = new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage);
    const aPrm = new THREE.BufferAttribute(prm, 4).setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', aPos);
    geo.setAttribute('aColor', aCol);
    geo.setAttribute('aParams', aPrm);
    geo.setDrawRange(0, 0);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uScale: scaleUniform, uCore: { value: core } },
      vertexShader: P_VERT,
      fragmentShader: P_FRAG,
      transparent: true,
      depthWrite: false,
      blending,
    });
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    points.renderOrder = renderOrder;
    points.visible = false;
    points.onBeforeRender = onBeforeRenderPoints;
    scene.add(points);
    return { data: new Float32Array(max * S), pos, col, prm, aPos, aCol, aPrm, geo, points, max, count: 0 };
  }

  function onBeforeRenderPoints(renderer, _scene, camera) {
    const rt = renderer.getRenderTarget();
    let h;
    if (rt) h = rt.height;
    else { renderer.getDrawingBufferSize(tmpV2); h = tmpV2.y; }
    scaleUniform.value = h * 0.5 * camera.projectionMatrix.elements[5];
  }

  const glow = makePool(4000, THREE.AdditiveBlending, 1.0, 20);   // sparkles, puffs, glows
  const soft = makePool(2500, THREE.NormalBlending, 0.15, 19);    // dust, confetti, fur

  // Emits one particle; returns its base offset into pool.data, or -1 if pool is full.
  function emit(pool, x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a) {
    if (pool.count >= pool.max) return -1;
    const o = pool.count++ * S;
    const d = pool.data;
    d[o + PX] = x; d[o + PY] = y; d[o + PZ] = z;
    d[o + VX] = vx; d[o + VY] = vy; d[o + VZ] = vz;
    d[o + AGE] = 0; d[o + LIFE] = life;
    d[o + S0] = s0; d[o + S1] = s1;
    d[o + GRAV] = 0; d[o + DRAG] = 0;
    d[o + CR] = r; d[o + CG] = g; d[o + CB] = b; d[o + A0] = a;
    d[o + ROT] = rand() * TAU; d[o + SPIN] = 0; d[o + PH] = rand() * TAU; d[o + FREQ] = 0;
    d[o + SHAPE] = SHAPE_ROUND; d[o + OX] = 0; d[o + OZ] = 0; d[o + OMEGA] = 0;

  function updatePool(pool, dt) {

      const drag = d[o + DRAG];

      d[o + VX] = vx; d[o + VY] = vy; d[o + VZ] = vz;

      const k = age / life;
      const size = d[o + S0] + (d[o + S1] - d[o + S0]) * k;

      prm[i4] = size; prm[i4 + 1] = alpha; prm[i4 + 2] = rot; prm[i4 + 3] = squash;
      i++;
    }
    pool.count = n;
    pool.geo.setDrawRange(0, n);

    return 18000 * Math.pow(1000 / 18000, clamp(v, 0, 1));
  }

  // ---------------------------------------------------------------- node groups / cleanup
  // Every sound builds a group; when the source with the latest stop time ends, all nodes are disconnected.
  function group() {
    const g = { nodes: [], last: null, lastEnd: -1, counted: false };
    g.add = (n) => { g.nodes.push(n); return n; };
    g.src = (n, start, stop) => {
      g.nodes.push(n);
      n.start(start);
      n.stop(stop);
      if (stop > g.lastEnd) { g.lastEnd = stop; g.last = n; }
      return n;
    };
    g.finish = (count) => {
      if (!g.last) { disconnectAll(g.nodes); return; }
      if (count) { active++; g.counted = true; }
      g.last.onended = () => {
        if (g.counted) active--;
        disconnectAll(g.nodes);
        g.nodes.length = 0;
      };
    };
    return g;
  }
  function disconnectAll(nodes) {
    for (const n of nodes) { try { n.disconnect(); } catch (e) { /* ignore */ } }
  }

  // Gain envelope: 0.0001 -> peak (linear attack) -> hold -> exponential decay to 0.0001.
  function env(param, t, a, hold, d, peak) {
    const p = Math.max(peak, 0.0002);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(p, t + a);
    if (hold > 0) param.setValueAtTime(p, t + a + hold);
    param.exponentialRampToValueAtTime(0.0001, t + a + hold + d);
  }

  function filt(g, dest, type, f, Q = 0.7, to = 0, t = 0, dur = 0) {
    const bq = g.add(ctx.createBiquadFilter());
    bq.type = type;
    bq.Q.value = Q;
    if (to && dur > 0) {
      bq.frequency.setValueAtTime(f, t);
      bq.frequency.exponentialRampToValueAtTime(to, t + dur);
    } else bq.frequency.value = f;
    bq.connect(dest);
    return bq;
  }

  // Oscillator with envelope. o: {type,f,to,slide,t,a,hold,d,peak,detune}
  function tone(g, dest, o) {
    const t = o.t, a = o.a ?? 0.005, hold = o.hold ?? 0, d = o.d ?? 0.2;
    const end = t + a + hold + d;
    const os = ctx.createOscillator();
    os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide ?? (a + hold + d)));
    if (o.detune) os.detune.value = o.detune;
    const gn = g.add(ctx.createGain());
    env(gn.gain, t, a, hold, d, o.peak ?? 0.2);
    os.connect(gn); gn.connect(dest);
    g.src(os, t, end + 0.02);
    return os;
  }

  // Filtered noise burst. o: {t,a,hold,d,peak,ft,f,to,Q}
  function noise(g, dest, o) {
    const t = o.t, a = o.a ?? 0.002, hold = o.hold ?? 0, d = o.d ?? 0.1;
    const end = t + a + hold + d;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const gn = g.add(ctx.createGain());
    env(gn.gain, t, a, hold, d, o.peak ?? 0.1);
    let head = gn;
    if (o.ft) head = filt(g, gn, o.ft, o.f, o.Q ?? 1, o.to, t, a + hold + d);
    src.connect(head); gn.connect(dest);
    g.nodes.push(src);
    src.start(t, Math.random() * 1.5);
    src.stop(end + 0.02);
    if (end + 0.02 > g.lastEnd) { g.lastEnd = end + 0.02; g.last = src; }
    return src;
  }

  // LFO into an AudioParam (vibrato / wobble).
  function lfo(g, param, rate, depth, t, end, type = 'sine') {
    const os = ctx.createOscillator(); os.type = type; os.frequency.value = rate;
    const gn = g.add(ctx.createGain()); gn.gain.value = depth;
    os.connect(gn); gn.connect(param);
    g.src(os, t, end);
    return os;
  }

  // Simple 2-op FM bell. o: {f, ratio, index, t, a, d, peak}
  function fm(g, dest, o) {
    const t = o.t, a = o.a ?? 0.003, d = o.d ?? 0.4, end = t + a + d;
    const car = ctx.createOscillator(); car.frequency.value = o.f;
    const mod = ctx.createOscillator(); mod.frequency.value = o.f * o.ratio;
    const mg = g.add(ctx.createGain());
    mg.gain.setValueAtTime(o.f * o.index, t);
    mg.gain.exponentialRampToValueAtTime(Math.max(1, o.f * 0.02), end);
    mod.connect(mg); mg.connect(car.frequency);
    const gn = g.add(ctx.createGain());
    env(gn.gain, t, a, 0, d, o.peak ?? 0.1);
    car.connect(gn); gn.connect(dest);
    g.src(mod, t, end + 0.02);
    g.src(car, t, end + 0.02);
  }

  // ---------------------------------------------------------------- SFX
  const SFX = {
    step(g, o, t, p) {
      noise(g, o, { t, a: 0.002, d: 0.035, peak: 0.05, ft: 'bandpass', f: 1700 * p * rnd(0.85, 1.15), Q: 1.8 });
      tone(g, o, { type: 'sine', f: 240 * p * rnd(0.9, 1.1), to: 150 * p, t, a: 0.002, d: 0.04, peak: 0.035 });
    },

    death(g, o, t, p) {
      // "mrrow!": saw through two formant bandpasses sweeping down, with vibrato
      const os = ctx.createOscillator(); os.type = 'sawtooth';
      os.frequency.setValueAtTime(480 * p, t);
      os.frequency.exponentialRampToValueAtTime(760 * p, t + 0.09);
      os.frequency.exponentialRampToValueAtTime(300 * p, t + 0.42);
      lfo(g, os.frequency, 7, 22 * p, t, t + 0.48);
      const eg = g.add(ctx.createGain());
      env(eg.gain, t, 0.03, 0.2, 0.22, 0.28);
      os.connect(eg);
      const f1 = filt(g, o, 'bandpass', 950 * p, 4, 520 * p, t, 0.45);
      const f2g = g.add(ctx.createGain()); f2g.gain.value = 0.5; f2g.connect(o);
      const f2 = filt(g, f2g, 'bandpass', 2400 * p, 7, 1300 * p, t, 0.45);
      const f3g = g.add(ctx.createGain()); f3g.gain.value = 0.35; f3g.connect(o);
      const f3 = filt(g, f3g, 'lowpass', 500 * p, 0.7);
      eg.connect(f1); eg.connect(f2); eg.connect(f3);
      g.src(os, t, t + 0.48);
      // thud
      tone(g, o, { type: 'sine', f: 150, to: 45, t: t + 0.36, a: 0.003, d: 0.2, peak: 0.5 });
      noise(g, o, { t: t + 0.36, d: 0.12, peak: 0.22, ft: 'lowpass', f: 320 });
    },

    revive(g, o, t, p) {
      const notes = [72, 76, 79, 84, 88, 91, 96];
      notes.forEach((m, i) => {
        const tt = t + i * 0.055;
        tone(g, o, { type: 'triangle', f: mtof(m) * p, t: tt, a: 0.005, d: 0.25, peak: 0.13 });
        tone(g, o, { type: 'sine', f: mtof(m + 12) * p, t: tt, a: 0.005, d: 0.18, peak: 0.035 });
      });
      noise(g, o, { t, a: 0.25, hold: 0.05, d: 0.3, peak: 0.045, ft: 'highpass', f: 5000, Q: 0.7 });
      for (let i = 0; i < 6; i++) {
        tone(g, o, { type: 'sine', f: rnd(2500, 5000) * p, t: t + 0.1 + Math.random() * 0.4, a: 0.002, d: 0.08, peak: 0.025 });
      }
    },

    pickup(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 3500);
      tone(g, lp, { type: 'square', f: 988 * p, t, a: 0.003, d: 0.06, peak: 0.06 });
      tone(g, o, { type: 'triangle', f: 988 * p, t, a: 0.003, d: 0.06, peak: 0.1 });
      tone(g, lp, { type: 'square', f: 1480 * p, t: t + 0.06, a: 0.003, d: 0.16, peak: 0.06 });
      tone(g, o, { type: 'triangle', f: 1480 * p, t: t + 0.06, a: 0.003, d: 0.16, peak: 0.1 });
    },

    boots(g, o, t, p) {
      noise(g, o, { t, a: 0.12, hold: 0.05, d: 0.15, peak: 0.2, ft: 'bandpass', f: 400 * p, to: 3500 * p, Q: 1.2 });
      fm(g, o, { f: 1568 * p, ratio: 3.01, index: 1.6, t: t + 0.2, a: 0.003, d: 0.4, peak: 0.1 });
      tone(g, o, { type: 'sine', f: 2349 * p, t: t + 0.2, a: 0.003, d: 0.3, peak: 0.05 });
    },

    life(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 2500);
      const seq = [[72, 0, 0.12, 0], [76, 0.09, 0.12, 0], [84, 0.18, 0.35, 0.08]];
      for (const [m, dt, d, hold] of seq) {
        const tt = t + dt, f = mtof(m) * p;
        tone(g, o, { type: 'triangle', f, t: tt, a: 0.006, hold, d, peak: 0.17 });
        tone(g, o, { type: 'sine', f: f / 2, t: tt, a: 0.006, hold, d, peak: 0.09 });
        tone(g, lp, { type: 'square', f, t: tt, a: 0.006, hold, d, peak: 0.025 });
      }
    },

    shield(g, o, t, p) {
      const os = tone(g, o, { type: 'sine', f: 280 * p, to: 840 * p, slide: 0.42, t, a: 0.04, hold: 0.25, d: 0.15, peak: 0.16 });
      lfo(g, os.frequency, 16, 40 * p, t, t + 0.46);
      const os2 = tone(g, o, { type: 'triangle', f: 560 * p, to: 1680 * p, slide: 0.42, t, a: 0.04, hold: 0.2, d: 0.15, peak: 0.04 });
      lfo(g, os2.frequency, 16, 80 * p, t, t + 0.42);
      for (let i = 0; i < 5; i++) {
        const f0 = rnd(500, 1000) * p;
        tone(g, o, { type: 'sine', f: f0, to: f0 * 1.8, t: t + i * 0.07 + Math.random() * 0.03, a: 0.004, d: 0.06, peak: 0.06 });
      }
    },

    shieldEnd(g, o, t, p) {
      tone(g, o, { type: 'sine', f: 900 * p, to: 180 * p, slide: 0.14, t, a: 0.003, d: 0.16, peak: 0.2 });
      noise(g, o, { t, d: 0.03, peak: 0.07, ft: 'lowpass', f: 1500 });
    },

    fish(g, o, t, p) {
      const r = p * rnd(0.96, 1.04);
      const lp = filt(g, o, 'lowpass', 6000);
      tone(g, lp, { type: 'square', f: 1319 * r, t, a: 0.002, d: 0.05, peak: 0.05 });
      tone(g, o, { type: 'sine', f: 1319 * r, t, a: 0.002, d: 0.05, peak: 0.08 });
      tone(g, lp, { type: 'square', f: 1976 * r, t: t + 0.05, a: 0.002, d: 0.2, peak: 0.05 });
      tone(g, o, { type: 'sine', f: 1976 * r, t: t + 0.05, a: 0.002, d: 0.2, peak: 0.08 });
    },

    levelClear(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 3500);
      const mel = [[67, 0, 0.09, 0], [72, 0.09, 0.09, 0], [76, 0.18, 0.09, 0], [79, 0.27, 0.12, 0],
                   [76, 0.4, 0.1, 0], [79, 0.5, 0.1, 0], [84, 0.62, 0.6, 0.3]];
      for (const [m, dt, d, hold] of mel) {
        const f = mtof(m) * p;
        const a = tone(g, o, { type: 'triangle', f, t: t + dt, a: 0.006, hold, d, peak: 0.14 });
        const b = tone(g, lp, { type: 'square', f, t: t + dt, a: 0.006, hold, d, peak: 0.045 });
        if (m === 84) { lfo(g, a.frequency, 6, 8, t + 0.8, t + 1.55); lfo(g, b.frequency, 6, 8, t + 0.8, t + 1.55); }
      }
      for (const m of [60, 64, 67, 72]) tone(g, o, { type: 'triangle', f: mtof(m) * p, t: t + 0.62, a: 0.01, hold: 0.45, d: 0.45, peak: 0.06 });
      tone(g, o, { type: 'sine', f: mtof(48) * p, t: t + 0.62, a: 0.005, hold: 0.3, d: 0.5, peak: 0.18 });
      noise(g, o, { t: t + 0.62, a: 0.003, d: 0.7, peak: 0.05, ft: 'highpass', f: 6000 });
    },

    levelStart(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 3000);
      const f1 = mtof(69) * p;
      tone(g, o, { type: 'triangle', f: f1, t, a: 0.005, hold: 0.1, d: 0.12, peak: 0.15 });
      tone(g, lp, { type: 'square', f: f1, t, a: 0.005, hold: 0.1, d: 0.12, peak: 0.04 });
      noise(g, o, { t, d: 0.04, peak: 0.05, ft: 'highpass', f: 4000 });
      const t2 = t + 0.45;
      for (const m of [81, 88]) {
        const f = mtof(m) * p;
        tone(g, o, { type: 'triangle', f, t: t2, a: 0.005, hold: 0.2, d: 0.35, peak: m === 81 ? 0.16 : 0.07 });
        tone(g, lp, { type: 'square', f, t: t2, a: 0.005, hold: 0.2, d: 0.35, peak: m === 81 ? 0.05 : 0.02 });
      }
      noise(g, o, { t: t2, d: 0.25, peak: 0.05, ft: 'highpass', f: 6000 });
    },

    teleport(g, o, t, p) {
      // flanger: dry + modulated short delay with feedback
      const lp = filt(g, o, 'lowpass', 5000);
      const dl = g.add(ctx.createDelay(0.05)); dl.delayTime.value = 0.004;
      const fb = g.add(ctx.createGain()); fb.gain.value = 0.55;
      const wet = g.add(ctx.createGain()); wet.gain.value = 0.7;
      lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(o);
      lfo(g, dl.delayTime, 5, 0.0028, t, t + 0.8); // keeper: lasts longest so the tail can ring out
      for (const det of [-12, 12]) {
        const os = ctx.createOscillator(); os.type = 'sawtooth'; os.detune.value = det;
        os.frequency.setValueAtTime(180 * p, t);
        os.frequency.exponentialRampToValueAtTime(2400 * p, t + 0.28);
        os.frequency.exponentialRampToValueAtTime(700 * p, t + 0.48);
        const gn = g.add(ctx.createGain());
        env(gn.gain, t, 0.02, 0.2, 0.26, 0.06);
        os.connect(gn); gn.connect(lp);
        g.src(os, t, t + 0.5);
      }
      noise(g, o, { t, a: 0.2, d: 0.25, peak: 0.05, ft: 'bandpass', f: 1500 * p, to: 8000 * p, Q: 2 });
    },

    gameOver(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 1800);
      const mel = [[67, 0, 0.36], [66, 0.45, 0.36], [65, 0.9, 0.36], [64, 1.35, 0.8]];
      for (const [m, dt, len] of mel) {
        const f = mtof(m) * p, last = m === 64;
        const a = tone(g, o, { type: 'triangle', f, t: t + dt, a: 0.02, hold: len * 0.5, d: len * 0.5, peak: 0.16 });
        const b = tone(g, lp, { type: 'square', f, t: t + dt, a: 0.02, hold: len * 0.5, d: len * 0.5, peak: 0.03 });
        tone(g, o, { type: 'sine', f: mtof(m - 24) * p, t: t + dt, a: 0.02, hold: len * 0.5, d: len * 0.5, peak: 0.12 });
        if (last) { lfo(g, a.frequency, 5, 6 * p, t + dt + 0.15, t + dt + 0.85); lfo(g, b.frequency, 5, 6 * p, t + dt + 0.15, t + dt + 0.85); }
      }
    },

    click(g, o, t, p) {
      tone(g, o, { type: 'sine', f: 1500 * p, t, a: 0.001, d: 0.03, peak: 0.1 });
      noise(g, o, { t, a: 0.001, d: 0.015, peak: 0.04, ft: 'highpass', f: 3000 });
    },

    extraLife(g, o, t, p) {
      noise(g, o, { t, a: 0.004, d: 0.5, peak: 0.16, ft: 'highpass', f: 2500, to: 6000, Q: 0.8 });
      fm(g, o, { f: 1760 * p, ratio: 1.414, index: 3, t, a: 0.003, d: 0.55, peak: 0.07 });
      fm(g, o, { f: 2637 * p, ratio: 2.76, index: 1.5, t, a: 0.003, d: 0.45, peak: 0.045 });
      tone(g, o, { type: 'sine', f: 110 * p, to: 55 * p, t, a: 0.003, d: 0.25, peak: 0.35 });
      tone(g, o, { type: 'sine', f: 800 * p, to: 2400 * p, slide: 0.08, t, a: 0.003, d: 0.15, peak: 0.06 });
    },

    tell(g, o, t, p) {
      const lp = filt(g, o, 'lowpass', 380);
      const am = g.add(ctx.createGain()); am.gain.value = 0.6; am.connect(lp);
      lfo(g, am.gain, 26, 0.4, t, t + 0.26, 'square');
      tone(g, am, { type: 'sawtooth', f: 78 * p, to: 60 * p, t, a: 0.03, hold: 0.08, d: 0.12, peak: 0.12 });
    },
  };

  // ---------------------------------------------------------------- public: play
  function play(name, opts) {
    if (!ready()) return;
    const fn = SFX[name];
    if (!fn) return;
    const o = opts || {};
    const pan = clamp(+o.pan || 0, -1, 1);
    const pitch = o.pitch > 0 ? +o.pitch : 1;
    const volume = o.volume == null ? 1 : clamp(+o.volume || 0, 0, 2);
    if (volume <= 0) return;
    const now = ctx.currentTime;
    if (name === 'step') {
      if (now - lastStep < 0.03) return;
      lastStep = now;
    }
    if (active > 64 || (active > 32 && (name === 'step' || name === 'tell'))) return;
    const g = group();
    try {
      const vg = g.add(ctx.createGain());
      vg.gain.value = volume;
      if (pan && ctx.createStereoPanner) {
        const pn = g.add(ctx.createStereoPanner());
        pn.pan.value = pan;
        vg.connect(pn); pn.connect(sfxBus);
      } else vg.connect(sfxBus);
      fn(g, vg, now + 0.01, pitch);
    } catch (e) { /* never throw from audio */ }
    g.finish(true);
  }

  // ---------------------------------------------------------------- music: pattern generation
  function mulberry(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const MAJOR = [0, 2, 4, 5, 7, 9, 11];
  const MIXO = [0, 2, 4, 5, 7, 9, 10];
  const PROG_MAJOR = [[0, 4, 5, 3], [0, 5, 3, 4], [5, 3, 0, 4], [0, 3, 5, 4], [3, 0, 4, 5], [0, 2, 3, 4]];
  const PROG_MIXO = [[0, 6, 3, 0], [0, 3, 6, 3], [0, 6, 4, 3], [3, 6, 0, 0]];

  function genPattern(level) {
    const r = mulberry((Math.imul(level, 2654435761) ^ 0x5bd1e995) >>> 0);
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    const key = Math.floor(r() * 12);
    const leadRoot = key < 5 ? 72 + key : 60 + key;   // 65..76
    const mixo = r() < 0.4;
    const scale = mixo ? MIXO : MAJOR;
    const prog = pick(mixo ? PROG_MIXO : PROG_MAJOR);
    const semi = (deg) => {
      const oct = Math.floor(deg / 7), idx = ((deg % 7) + 7) % 7;
      return scale[idx] + 12 * oct;
    };
    const tempo = Math.min(160, 110 + 4 * level);
    // bass: 'r' root, 'o' octave, 'f' fifth, with length in steps
    const busy = Math.min(1, level / 8);
    const bass = new Array(16).fill(null);
    for (let s = 0; s < 16; s++) {
      let pr = s === 0 ? 1 : s % 4 === 0 ? 0.7 : s % 2 === 0 ? 0.4 + 0.2 * busy : 0.08 + 0.2 * busy;
      if (r() < pr) bass[s] = { k: s === 0 ? 'r' : pick(['r', 'r', 'o', 'f']), len: 1 };
    }
    for (let s = 0; s < 16; s++) if (bass[s]) { let n = 1; while (s + n < 16 && !bass[s + n] && n < 4) n++; bass[s].len = n; }
    const kick = new Set([0, 8]);
    if (r() < 0.5) kick.add(10);
    if (r() < 0.35) kick.add(6);
    if (level >= 4) kick.add(r() < 0.5 ? 14 : 3);
    const snare = new Set([4, 12]);
    const ghost = level >= 3 && r() < 0.6 ? (r() < 0.5 ? 15 : 7) : -1;
    const openHat = r() < 0.5 ? 14 : 6;
    const genMotif = (density) => {
      const m = new Array(16).fill(null);
      let cur = pick([0, 2, 4]);
      for (let s = 0; s < 16; s++) {
        const strong = s % 4 === 0;
        if (r() < (strong ? density + 0.2 : s % 2 === 0 ? density : density * 0.45)) {
          cur += pick([-2, -1, -1, 0, 1, 1, 2]);
          cur = clamp(cur, -1, 7);
          if (strong) { const ct = [0, 2, 4, 7]; cur = ct.reduce((b, c) => (Math.abs(c - cur) < Math.abs(b - cur) ? c : b), 0); }
          m[s] = { off: cur, len: 1 };
        }
      }
      for (let s = 0; s < 16; s++) if (m[s]) { let n = 1; while (s + n < 16 && !m[s + n] && n < 4) n++; m[s].len = n; }
      return m;
    };
    const dens = 0.25 + 0.05 * Math.min(level, 7);
    const motifs = [genMotif(dens), genMotif(dens), genMotif(dens * 0.8)];
    const order = [0, 1, 0, 2];
    const arpShape = pick([[0, 1, 2, 1], [0, 1, 2, 3], [2, 1, 0, 1], [0, 2, 1, 3]]);
    const leadWave = level % 2 === 0 ? 'square' : 'triangle';
    return { level, key, leadRoot, mixo, prog, semi, tempo, bass, kick, snare, ghost, openHat, motifs, order, arpShape, leadWave,
      swing: tempo < 140 ? 0.12 : 0.05 };
  }

  // ---------------------------------------------------------------- music: instruments
  function mKick(dest, t, vel) {
    const g = group();
    tone(g, dest, { type: 'sine', f: 140, to: 42, slide: 0.12, t, a: 0.003, d: 0.28, peak: 0.75 * vel });
    noise(g, dest, { t, a: 0.001, d: 0.015, peak: 0.06 * vel, ft: 'lowpass', f: 2500 });
    g.finish(false);
  }
  function mSnare(dest, t, vel) {
