<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ===== config.js =====
const { CFG, MAP_RINGS, levelParams, PLAYER_COLORS, PLAYER_NAMES } = (() => {
// Shared tuning constants. Pure data, no three.js.

const CFG = {
  TICK: 1 / 60,

  // Kitty
  KITTY_RADIUS: 0.4,
  KITTY_SPEED: 6.5,          // units / second at speedMult 1
  KITTY_ACCEL_TAU: 0.05,     // velocity smoothing time constant (s)
  KITTY_HIT_SCALE: 0.85,     // kitty hitbox = radius * this
  SPEED_BOOST: 0.06,         // +6% per boots
  SPEED_MULT_MAX: 1.6,
  MAX_EXTRA_LIVES: 1,
  SPAWN_INVULN: 2.0,         // seconds after level start / revive
  SHIELD_TIME: 4.0,          // seconds from shield pickup

  // Revive
  REVIVE_RADIUS: 1.1,        // circle radius; living kitty center within REVIVE_RADIUS + KITTY_RADIUS revives

  // Maze geometry
  CENTER_RADIUS: 5.0,        // radius of goal area wall
  RING_WIDTH: 6.0,           // corridor width
  WALL_THICKNESS: 0.5,
  WALL_HEIGHT: 1.4,
  GAP_WIDTH: 2.8,            // linear width of a gap in a ring wall (units)
  START_SAFE_ARC: 7.0,       // linear arc length (units) on each side of start angle with no enemies

  // Enemies
  WOLF_RADIUS: 0.55,
  WOLF_HIT_SCALE: 0.8,

  // Items
  ITEM_RADIUS: 0.6,

  // Flow
  LEVEL_CLEAR_TIME: 2.4,     // seconds of celebration before next level
};

// Number of rings in the (fixed) map. 6 rings x 6 wide ≈ 870 units of running to the center.
const MAP_RINGS = 6;

// Difficulty curve. level starts at 1.
function levelParams(level) {
  const L = Math.max(1, level | 0);
  // The map is the same every level (fixed spiral, see maze.js); only the wolves scale.
  const types = ['patroller', 'wanderer'];
  if (L >= 2) types.push('orbiter');
  if (L >= 3) types.push('sweeper');
  return {
    rings: MAP_RINGS,                                               // fixed: same map every level
    // Fixed wolf count on every level (~1 wolf per 4 units of the ~880-unit spiral);
    // levels get harder through speed, shorter pauses, bigger territories and new wolf types.
    enemyCount: 220,
    enemySpeed: Math.min(2.4 * (1 + 0.08 * (L - 1)), 5.3),          // units / s (always below kitty speed)
    enemyPauseScale: Math.max(0.4, 1 - 0.07 * (L - 1)),             // wolves rest less each level
    enemyTypes: types,
    itemCount: 8 + Math.floor(L / 2),
    fishCount: 36 + L * 3,
  };
}

// Kitty colors for up to 4 players.
const PLAYER_COLORS = [0xffb347, 0x6ec6ff, 0xff7eb6, 0x9dff7a];
const PLAYER_NAMES = ['Mittens', 'Biscuit', 'Pixel', 'Noodle'];

return { CFG, MAP_RINGS, levelParams, PLAYER_COLORS, PLAYER_NAMES };
})();
// ===== rng.js =====
const { createRng, hashSeed, TAU, normAngle, angleDiff } = (() => {
// Seeded deterministic RNG (mulberry32). Pure, no three.js.

function createRng(seed) {
  let s = (seed >>> 0) || 1;
  const next = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,                                              // [0,1)
    range: (a, b) => a + (b - a) * next(),             // [a,b)
    int: (a, b) => a + Math.floor(next() * (b - a + 1)), // inclusive ints
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    chance: (p) => next() < p,
    shuffle: (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
  };
}

function hashSeed(...parts) {
  let h = 2166136261 >>> 0;
  for (const p of parts) {
    const str = String(p);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    h ^= 0x9e3779b9; h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

const TAU = Math.PI * 2;

// Normalize angle to [0, TAU).
function normAngle(a) {
  a %= TAU;
  return a < 0 ? a + TAU : a;
}

// Smallest signed difference b - a in (-PI, PI].
function angleDiff(a, b) {
  let d = normAngle(b - a);
  return d > Math.PI ? d - TAU : d;
}

return { createRng, hashSeed, TAU, normAngle, angleDiff };
})();
// ===== maze.js =====
const { generateLevel, collideCircle, locate, inCenter, mazeSelfTest } = (() => {
// Circular labyrinth generation + collision. Pure (no THREE, no DOM).
// The wall layout is a fixed spiral (same on every level); only wolves/items vary by level+seed.
//
// Contract notes / interpretations:
// - segments carry an extra boolean `full` (true only for corridors without radial walls,
//   which are reported as a0=0, a1=TAU). A corridor with exactly ONE radial wall yields a
//   segment a0=w, a1=w+TAU with full=false (a C-shaped loop blocked at w).
// - All angular intervals (wallArcs, segments, enemy a0/a1) use a0 in [0,TAU), a1 > a0,
//   a1 may exceed TAU. Sweeper `angle` lies inside [a0,a1] in that same unwrapped frame.
// - Enemy a0/a1 are a "territory": a sub-range of the (shrunk) segment, so wolves spread out
//   over the maze. Orbiters get their whole segment (full ring => exactly 0..TAU).
// - Gap halfAngle = (GAP_WIDTH/2) / wallRadius (linear opening GAP_WIDTH at the wall centerline).
// - collideCircle uses a lazily built spatial grid cached in a WeakMap keyed by levelData
//   (no extra fields are added to LevelData).


const HALF_T = CFG.WALL_THICKNESS / 2;
const WOLF_MARGIN = HALF_T + CFG.WOLF_RADIUS + 0.06;
const REST_STOP = 4.5;            // wolf-free arc (units) on each side of every corridor divider
const GRID_CELL = 2.0;
const GRID_MAX_R = 1.0;           // grid query valid for radii up to this; larger -> brute force

// ---------------------------------------------------------------- helpers

function midR(R, i) { return (R[i] + R[i + 1]) / 2; }

// unwrap angle `a` into [base, base+TAU)
function unwrapFrom(base, a) { return base + normAngle(a - base); }

function segContains(seg, a) {
  if (seg.full) return true;
  return normAngle(a - seg.a0) <= seg.a1 - seg.a0 + 1e-12;
}

// angular travel distance between angles A and B inside segment (radians)
function segArcDist(seg, A, B) {
  if (seg.full) return Math.abs(angleDiff(A, B));
  return Math.abs(unwrapFrom(seg.a0, A) - unwrapFrom(seg.a0, B));
}

// largest piece of [lo,hi] after removing [f0,f1] (and its TAU-periodic copies)
function clipArc(lo, hi, f0, f1) {
  let pieces = [[lo, hi]];
  for (let k = -2; k <= 2; k++) {
    const F0 = f0 + k * TAU, F1 = f1 + k * TAU;
    const next = [];
    for (const [p, q] of pieces) {
      if (F1 <= p || F0 >= q) { next.push([p, q]); continue; }
      if (F0 > p) next.push([p, F0]);
      if (q > F1) next.push([F1, q]);
    }
    pieces = next;
  }
  let best = null;
  for (const pc of pieces) if (!best || pc[1] - pc[0] > best[1] - best[0]) best = pc;
  return best;
}

function pickWeighted(rng, items, weightFn) {
  let total = 0;
  for (const it of items) total += Math.max(0, weightFn(it));
  if (total <= 0) return items[Math.floor(rng.next() * items.length)];
  let t = rng.next() * total;
  for (const it of items) {
    t -= Math.max(0, weightFn(it));
    if (t <= 0) return it;
  }
  return items[items.length - 1];
}

// ---------------------------------------------------------------- topology

function buildSegments(rings, radialWalls) {
  const segments = [];
  for (let i = 0; i < rings; i++) {
    const angs = radialWalls.filter(w => w.corridor === i).map(w => w.angle).sort((a, b) => a - b);
    if (angs.length === 0) {
      segments.push({ id: segments.length, corridor: i, a0: 0, a1: TAU, full: true });
      continue;
    }
    for (let k = 0; k < angs.length; k++) {
      const a0 = angs[k];
      const len = angs.length === 1 ? TAU : normAngle(angs[(k + 1) % angs.length] - a0);
      segments.push({ id: segments.length, corridor: i, a0, a1: a0 + len, full: false });
    }
  }
  return segments;
}

function findSeg(segments, corridor, a) {
  for (const s of segments) if (s.corridor === corridor && segContains(s, a)) return s;
  return null;
}

// Dijkstra over points of interest: start, gaps, center.
// Returns { ok, legs: [{ seg, from, to, gapTo }], segOnPath:Set, gapLinks } where legs walk the route.
function solveRoute(ctx, segments) {
  const { R, rings, gaps, startAngle } = ctx;
  const RW = CFG.RING_WIDTH;
  // nodes: 0 = start, 1..G = gaps, G+1 = center
  const G = gaps.length;
  const CENTER = G + 1;
  const gapSegs = gaps.map(g => ({
    inner: g.wall === 0 ? null : findSeg(segments, g.wall - 1, g.angle),
    outer: g.wall >= rings ? null : findSeg(segments, g.wall, g.angle),
  }));
  const startSeg = findSeg(segments, rings - 1, startAngle);
  // per segment: list of [node, angle]
  const touch = new Map();
  const addTouch = (seg, node, ang) => {
    if (!seg) return;
    if (!touch.has(seg.id)) touch.set(seg.id, []);
    touch.get(seg.id).push([node, ang]);
  };
  addTouch(startSeg, 0, startAngle);
  gaps.forEach((g, k) => { addTouch(gapSegs[k].inner, k + 1, g.angle); addTouch(gapSegs[k].outer, k + 1, g.angle); });
  const adj = [];
  for (let n = 0; n <= CENTER; n++) adj.push([]);
  for (const [sid, list] of touch) {
    const seg = segments[sid];
    const rm = midR(R, seg.corridor);
    for (let a = 0; a < list.length; a++) {
      for (let b = 0; b < list.length; b++) {
        if (a === b || list[a][0] === list[b][0]) continue;
        const cost = segArcDist(seg, list[a][1], list[b][1]) * rm + (list[b][0] === 0 ? 0 : RW);
        adj[list[a][0]].push({ to: list[b][0], cost, seg, fromA: list[a][1], toA: list[b][1] });
      }
    }
  }
  gaps.forEach((g, k) => { if (g.wall === 0 && gapSegs[k].outer) adj[k + 1].push({ to: CENTER, cost: RW, seg: null, fromA: g.angle, toA: g.angle }); });

  const dist = new Array(CENTER + 1).fill(Infinity);
  const prev = new Array(CENTER + 1).fill(null);
  const done = new Array(CENTER + 1).fill(false);
  dist[0] = 0;
  for (;;) {
    let u = -1;
    for (let n = 0; n <= CENTER; n++) if (!done[n] && dist[n] < Infinity && (u < 0 || dist[n] < dist[u])) u = n;
    if (u < 0) break;
    done[u] = true;
    if (u === CENTER) break;
    for (const e of adj[u]) {
      const nd = dist[u] + e.cost;
      if (nd < dist[e.to] - 1e-9) { dist[e.to] = nd; prev[e.to] = { from: u, e }; }
    }
  }
  // reachable segments (for dead-end detection etc.)
  const reach = new Set();
  if (dist[CENTER] === Infinity) return { ok: false, legs: [], length: Infinity, gapSegs, startSeg, reach };
  const legs = [];
  let n = CENTER;
  while (n !== 0) { legs.push(prev[n].e); n = prev[n].from; }
  legs.reverse();
  return { ok: true, legs, length: dist[CENTER], gapSegs, startSeg, reach };
}

// ---------------------------------------------------------------- generation

// Fixed spiral layout (identical on every level): each corridor has one divider wall with the
// entrance gap just on its + side and the exit gap just on its - side, so the only route runs
// ~360 deg around every ring, then drops inward. No choices, no dead ends.
const SPIRAL_CLEAR = 0.35;   // linear clearance between a gap edge and the divider beside it
function buildSpiral(R, rings) {
  const gaps = [], radialWalls = [];
  const off = (r) => (CFG.GAP_WIDTH / 2 + HALF_T + SPIRAL_CLEAR) / r;
  const rmOut = midR(R, rings - 1);
  const startAngle = Math.PI / 2;                 // nearest the camera (screen bottom)
  let w = startAngle - 3.2 / rmOut;               // outermost divider sits just behind the start
  for (let i = rings - 1; i >= 0; i--) {
    radialWalls.push({ angle: normAngle(w), r0: R[i], r1: R[i + 1], corridor: i });
    const g = w - off(R[i]);
    gaps.push({ wall: i, angle: normAngle(g), halfAngle: (CFG.GAP_WIDTH / 2) / R[i] });
    w = g - off(R[i]);
  }
  gaps.sort((a, b) => a.wall - b.wall || a.angle - b.angle);
  return { startAngle: normAngle(startAngle), gaps, radialWalls };
}

function buildWallArcs(R, rings, gaps) {
  const arcs = [];
  for (let j = 0; j <= rings; j++) {
    const gs = gaps.filter(g => g.wall === j).sort((a, b) => a.angle - b.angle);
    if (gs.length === 0) { arcs.push({ radius: R[j], a0: 0, a1: TAU, wall: j }); continue; }
    for (let k = 0; k < gs.length; k++) {
      const g = gs[k], h = gs[(k + 1) % gs.length];
      const start = g.angle + g.halfAngle;
      const len = normAngle((h.angle - h.halfAngle) - start);
      if (len < 1e-6) continue;
      arcs.push({ radius: R[j], a0: normAngle(start), a1: normAngle(start) + len, wall: j });
    }
  }
  return arcs;
}

function buildWallSegments(arcs, radialWalls) {
  const out = [];
  for (const arc of arcs) {
    const len = (arc.a1 - arc.a0) * arc.radius;
    const n = Math.max(1, Math.ceil(len / 1.0));
    let px = arc.radius * Math.cos(arc.a0), pz = arc.radius * Math.sin(arc.a0);
    for (let k = 1; k <= n; k++) {
      const a = arc.a0 + (arc.a1 - arc.a0) * (k / n);
      const qx = arc.radius * Math.cos(a), qz = arc.radius * Math.sin(a);
      out.push({ ax: px, az: pz, bx: qx, bz: qz });
      px = qx; pz = qz;
    }
  }
  for (const w of radialWalls) {
    const c = Math.cos(w.angle), s = Math.sin(w.angle);
    out.push({ ax: w.r0 * c, az: w.r0 * s, bx: w.r1 * c, bz: w.r1 * s });
  }
  return out;
}

function buildPath(R, startAngle, rings, legs) {
  const pts = [];
  const STEP = 2.0;
  const push = (x, z) => {
    const l = pts[pts.length - 1];
    if (l && Math.hypot(l.x - x, l.z - z) < 1e-6) return;
    pts.push({ x, z });
  };
  let curCorr = rings - 1;
  let curAng = startAngle;
  push(midR(R, curCorr) * Math.cos(curAng), midR(R, curCorr) * Math.sin(curAng));
  const radialTo = (ang, rFrom, rTo) => {
    const n = Math.max(1, Math.ceil(Math.abs(rTo - rFrom) / STEP));
    for (let k = 1; k <= n; k++) {
      const r = rFrom + (rTo - rFrom) * (k / n);
      push(r * Math.cos(ang), r * Math.sin(ang));
    }
  };
  for (const leg of legs) {
    if (!leg.seg) { // into center
      radialTo(leg.toA, midR(R, curCorr), 0);
      curCorr = -1;
      continue;
    }
    const c = leg.seg.corridor;
    if (c !== curCorr) { radialTo(curAng, midR(R, curCorr), midR(R, c)); curCorr = c; }
    const rm = midR(R, c);
    let uA, uB;
    if (leg.seg.full) { uA = leg.fromA; uB = uA + angleDiff(leg.fromA, leg.toA); }
    else { uA = unwrapFrom(leg.seg.a0, leg.fromA); uB = unwrapFrom(leg.seg.a0, leg.toA); }
    const n = Math.max(1, Math.ceil(Math.abs(uB - uA) * rm / STEP));
    for (let k = 1; k <= n; k++) {
      const a = uA + (uB - uA) * (k / n);
      push(rm * Math.cos(a), rm * Math.sin(a));
    }
    curAng = leg.toA;
  }
  return pts;
}

function placeEnemies(rng, lvl, p, route) {
  const { R, rings, segments, startAngle, seed, level } = lvl;
  const enemies = [];
  const count = p.enemyCount;
  const safeHalf = (CFG.START_SAFE_ARC + CFG.WOLF_RADIUS) / (R[rings - 1] + WOLF_MARGIN);
  const safe0 = startAngle - safeHalf, safe1 = startAngle + safeHalf;
  // corridor quotas proportional to usable length
  const lens = [];
  for (let i = 0; i < rings; i++) {
    let L = TAU * midR(R, i);
    if (i === rings - 1) L -= 2 * CFG.START_SAFE_ARC;
    lens.push(Math.max(1, L));
  }
  const total = lens.reduce((a, b) => a + b, 0);
  const quota = lens.map(L => Math.floor(L / total * count));
  const fracs = lens.map((L, i) => ({ i, f: L / total * count - quota[i] })).sort((a, b) => b.f - a.f);
  let left = count - quota.reduce((a, b) => a + b, 0);
  for (let k = 0; left > 0; k++, left--) quota[fracs[k % fracs.length].i]++;

  for (let i = 0; i < rings; i++) {
    const m = quota[i];
    if (m <= 0) continue;
    const rIn = R[i] + WOLF_MARGIN, rOut = R[i + 1] - WOLF_MARGIN;
    const rm = midR(R, i);
    // Divider ends are rest stops: keep wolves REST_STOP units away from each corridor's divider
    // (covers the entrance and exit gaps that flank it).
    const sh = (WOLF_MARGIN + REST_STOP) / rIn;
    const spanScale = 1 + Math.min(1, 0.1 * (level - 1));   // territories grow with level
    // stratified centers over the usable angular range
    let rangeLo = 0, rangeLen = TAU;
    if (i === rings - 1) { rangeLo = safe1 + 0.5 / rm; rangeLen = TAU - 2 * safeHalf - 1.0 / rm; }
    const off = rng.next();
    for (let k = 0; k < m; k++) {
      let spec = null;
      for (let attempt = 0; attempt < 6 && !spec; attempt++) {
        const t = attempt === 0 ? (k + off * 0.6 + 0.2) / m : rng.next();
        const c = normAngle(rangeLo + rangeLen * Math.min(0.999, t) + rng.range(-0.15, 0.15) / m * rangeLen * (attempt === 0 ? 1 : 0));
        const seg = findSeg(segments, i, c);
        if (!seg) continue;
        const segLen = seg.a1 - seg.a0;
        let type = rng.pick(p.enemyTypes);
        if (type === 'orbiter' && !(seg.full || segLen >= TAU / 3)) {
          const others = p.enemyTypes.filter(x => x !== 'orbiter');
          type = rng.pick(others);
        }
        let lo, hi;
        if (type === 'orbiter') {
          if (seg.full) {
            if (i === rings - 1) { lo = normAngle(safe1); hi = lo + (TAU - 2 * safeHalf); }
            else { lo = 0; hi = TAU; }
          } else { lo = seg.a0 + sh; hi = seg.a1 - sh; }
        } else {
          const spanLin = spanScale * (type === 'patroller' ? rng.range(8, 18) : type === 'wanderer' ? rng.range(10, 20) : rng.range(2, 5));
          const half = spanLin / 2 / rm;
          const cu = seg.full ? c : unwrapFrom(seg.a0, c);
          lo = cu - half; hi = cu + half;
          if (!seg.full) { lo = Math.max(lo, seg.a0 + sh); hi = Math.min(hi, seg.a1 - sh); }
        }
        if (i === rings - 1) {
          const piece = clipArc(lo, hi, safe0, safe1);
          if (!piece) continue;
          [lo, hi] = piece;
        }
        if ((hi - lo) * rIn < (type === 'sweeper' ? 0.5 : 2.5)) continue;
        const a0 = normAngle(lo);
        const a1 = a0 + Math.min(TAU, hi - lo);
        const full = type === 'orbiter' && hi - lo >= TAU - 1e-9;
        const speedBase = p.enemySpeed * rng.range(0.85, 1.15);
        const id = enemies.length;
        spec = {
          id, type, corridor: i, segment: seg.id,
          rIn, rOut,
          a0: full ? 0 : a0, a1: full ? TAU : a1,
          speed: speedBase * (type === 'orbiter' ? 0.8 : type === 'sweeper' ? 0.9 : 1),
          phase: rng.next(),
          pauseScale: p.enemyPauseScale,
          seed: hashSeed(seed, level, 'wolf', id),
        };
        if (type === 'patroller' || type === 'orbiter') spec.r = rng.range(rIn + 0.2, rOut - 0.2);
        if (type === 'orbiter') spec.dir = rng.chance(0.5) ? 1 : -1;
        if (type === 'sweeper') spec.angle = (spec.a0 + spec.a1) / 2;
      }
      if (spec) enemies.push(spec);
    }
  }
  return enemies;
}

function distToPath(path, x, z) {
  let d = Infinity;
  for (const q of path) d = Math.min(d, (q.x - x) * (q.x - x) + (q.z - z) * (q.z - z));
  return Math.sqrt(d);
}

function placeItems(rng, lvl, p, route) {
  const { R, rings, segments, spawnPoints, path, enemies } = lvl;
  const items = [];
  const taken = [];
  const okSpot = (x, z, minSep) => {
    for (const s of spawnPoints) if (Math.hypot(s.x - x, s.z - z) < 4) return false;
    for (const t of taken) if (Math.hypot(t.x - x, t.z - z) < minSep) return false;
    if (collideCircle(lvl, x, z, CFG.ITEM_RADIUS + 0.15).hit) return false;
    return true;
  };
  // segment degrees (number of gap connections) -> dead ends
  const degree = new Map();
  for (const gs of route.gapSegs) {
    if (gs.inner) degree.set(gs.inner.id, (degree.get(gs.inner.id) || 0) + 1);
    if (gs.outer) degree.set(gs.outer.id, (degree.get(gs.outer.id) || 0) + 1);
  }
  const onPath = new Set(route.legs.filter(l => l.seg).map(l => l.seg.id));
  const randomPointIn = (seg) => {
    const i = seg.corridor;
    const r = rng.range(R[i] + 1.2, R[i + 1] - 1.2);
    const pad = 1.2 / R[i];
    const span = (seg.a1 - seg.a0) - 2 * pad;
    const a = seg.full ? rng.next() * TAU : seg.a0 + pad + rng.next() * Math.max(0, span);
    return { x: r * Math.cos(a), z: r * Math.sin(a), seg };
  };
  const segWeight = (s) => (s.a1 - s.a0) * midR(R, s.corridor);

  // power-ups
  const types = [['boots', 5], ['life', 2], ['shield', 3]];
  for (let n = 0; n < p.itemCount; n++) {
    const type = pickWeighted(rng, types, t => t[1])[0];
    let best = null, bestScore = -Infinity;
    for (let s = 0; s < 40; s++) {
      const seg = pickWeighted(rng, segments, segWeight);
      const c = randomPointIn(seg);
      if (!okSpot(c.x, c.z, 6)) continue;
      const deadEnd = !onPath.has(seg.id) && (degree.get(seg.id) || 0) <= 1;
      const score = Math.min(distToPath(path, c.x, c.z), 12) + (deadEnd ? 8 : 0) + rng.next() * 4;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    if (best) {
      const it = { id: items.length, type, x: best.x, z: best.z };
      items.push(it); taken.push(it);
    }
  }

  // fish breadcrumb trails (groups of up to 3 along the corridor arc)
  let fishLeft = p.fishCount;
  for (let g = 0; g < p.fishCount * 3 && fishLeft > 0; g++) {
    let ax, az;
    const roll = rng.next();
    if (roll < 0.55 && path.length > 4) {
      const q = path[rng.int(2, path.length - 2)];
      ax = q.x; az = q.z;
    } else if (roll < 0.75 && enemies.length) {
      // lure towards a wolf territory (risky!)
      const e = rng.pick(enemies);
      const a = e.type === 'sweeper' ? e.angle : rng.range(e.a0, e.a1);
      const r = rng.range(e.rIn, e.rOut);
      ax = r * Math.cos(a); az = r * Math.sin(a);
    } else {
      const c = randomPointIn(pickWeighted(rng, segments, segWeight));
      ax = c.x; az = c.z;
    }
    const loc = locate(lvl, ax, az);
    if (loc.corridor < 0 || loc.corridor >= rings) continue;
    const i = loc.corridor;
    const r = Math.min(Math.max(loc.r + rng.range(-0.8, 0.8), R[i] + 1.0), R[i + 1] - 1.0);
    const dir = rng.chance(0.5) ? 1 : -1;
    const step = 1.6 / r;
    const groupN = Math.min(3, fishLeft);
    const group = [];
    for (let k = 0; k < groupN; k++) {
      const a = loc.angle + dir * step * k;
      const x = r * Math.cos(a), z = r * Math.sin(a);
      if (locate(lvl, x, z).segment !== loc.segment) break;
      if (!okSpot(x, z, 1.3)) break;
      group.push({ x, z });
    }
    if (group.length < groupN) continue;
    for (const f of group) {
      const it = { id: items.length, type: 'fish', x: f.x, z: f.z };
      items.push(it); taken.push(it);
    }
    fishLeft -= groupN;
  }
  return items;
}

function generateLevel(level, seed) {
  const L = Math.max(1, level | 0);
  const p = levelParams(L);
  const rng = createRng(hashSeed(seed, L));
  const rings = p.rings;
  const R = [];
  for (let j = 0; j <= rings; j++) R.push(CFG.CENTER_RADIUS + j * CFG.RING_WIDTH);

  const { startAngle, gaps, radialWalls } = buildSpiral(R, rings);
  const ctx = { R, rings, gaps, startAngle };
  const segments = buildSegments(rings, radialWalls);
  const route = solveRoute(ctx, segments);

  const wallArcs = buildWallArcs(R, rings, gaps);
  const wallSegments = buildWallSegments(wallArcs, radialWalls);
  const path = buildPath(R, startAngle, rings, route.legs);

  // spawn points: 2x2 block around startAngle, facing the route's first direction
  const firstLeg = route.legs[0];
  let dirSign = 1;
  if (firstLeg && firstLeg.seg) {
    const d = firstLeg.seg.full ? angleDiff(firstLeg.fromA, firstLeg.toA)
      : unwrapFrom(firstLeg.seg.a0, firstLeg.toA) - unwrapFrom(firstLeg.seg.a0, firstLeg.fromA);
    dirSign = d >= 0 ? 1 : -1;
  }
  const rmOut = midR(R, rings - 1);
  const spawnPoints = [];
  for (const [dr, dt] of [[-1.1, 0.9], [1.1, 0.9], [-1.1, -0.9], [1.1, -0.9]]) {
    const r = rmOut + dr;
    const a = startAngle + (dt * dirSign) / r;
    spawnPoints.push({ x: r * Math.cos(a), z: r * Math.sin(a), heading: normAngle(a + dirSign * Math.PI / 2) });
  }

  const lvl = {
    level: L, seed, rings,
    ringRadii: R,
    outerRadius: R[rings],
    gaps,
    wallArcs,
    radialWalls,
    segments,
    wallSegments,
    startAngle,
    spawnPoints,
    enemies: [],
    items: [],
    path,
    theme: (L - 1) % 4,
  };
  // internal fields used during generation only (removed below)
  lvl.R = R;
  lvl.enemies = placeEnemies(rng, lvl, p, route);
  lvl.items = placeItems(rng, lvl, p, route);
  delete lvl.R;
  return lvl;
}

// ---------------------------------------------------------------- collision

const gridCache = new WeakMap();

function getGrid(ld) {
  let g = gridCache.get(ld);
  if (g && g.src === ld.wallSegments) return g;
  const segs = ld.wallSegments;
  const n = segs.length;
  const data = new Float64Array(n * 4);
  for (let k = 0; k < n; k++) {
    const s = segs[k];
    data[k * 4] = s.ax; data[k * 4 + 1] = s.az; data[k * 4 + 2] = s.bx; data[k * 4 + 3] = s.bz;
  }
  const ext = (ld.outerRadius || 0) + 3;
  const dim = Math.max(1, Math.ceil((2 * ext) / GRID_CELL));
  const cells = new Array(dim * dim);
  for (let c = 0; c < cells.length; c++) cells[c] = [];
  const E = HALF_T + GRID_MAX_R + 0.01;
  const toCell = (v) => Math.min(dim - 1, Math.max(0, Math.floor((v + ext) / GRID_CELL)));
  for (let k = 0; k < n; k++) {
    const ax = data[k * 4], az = data[k * 4 + 1], bx = data[k * 4 + 2], bz = data[k * 4 + 3];
    const cx0 = toCell(Math.min(ax, bx) - E), cx1 = toCell(Math.max(ax, bx) + E);
    const cz0 = toCell(Math.min(az, bz) - E), cz1 = toCell(Math.max(az, bz) + E);
    for (let cz = cz0; cz <= cz1; cz++) for (let cx = cx0; cx <= cx1; cx++) cells[cz * dim + cx].push(k);
  }
  const all = [];
  for (let k = 0; k < n; k++) all.push(k);
  g = { src: segs, data, cells, dim, ext, all };
  gridCache.set(ld, g);
  return g;
}

function collideCircle(levelData, x, z, radius) {
  const g = getGrid(levelData);
  const d = g.data;
  const minD = radius + HALF_T;
  const minD2 = minD * minD;
  let hit = false;
  for (let pass = 0; pass < 3; pass++) {
    let list;
    if (radius <= GRID_MAX_R) {
      const cx = Math.floor((x + g.ext) / GRID_CELL), cz = Math.floor((z + g.ext) / GRID_CELL);
      list = (cx < 0 || cz < 0 || cx >= g.dim || cz >= g.dim) ? null : g.cells[cz * g.dim + cx];
      if (!list) list = g.all;
    } else list = g.all;
    let moved = false;
    for (let m = 0; m < list.length; m++) {
      const k = list[m] * 4;
      const ax = d[k], az = d[k + 1], bx = d[k + 2], bz = d[k + 3];
      const ex = bx - ax, ez = bz - az;
      const len2 = ex * ex + ez * ez;
      let t = len2 > 0 ? ((x - ax) * ex + (z - az) * ez) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + ex * t, pz = az + ez * t;
      const dx = x - px, dz = z - pz;
      const dd = dx * dx + dz * dz;
      if (dd >= minD2) continue;
      const dl = Math.sqrt(dd);
      let nx, nz;
      if (dl > 1e-9) { nx = dx / dl; nz = dz / dl; }
      else {
        const el = Math.sqrt(len2) || 1;
        nx = -ez / el; nz = ex / el;
        if (nx * px + nz * pz > 0) { nx = -nx; nz = -nz; } // degenerate: prefer pushing inward
      }
      x = px + nx * minD; z = pz + nz * minD;
      hit = true; moved = true;
    }
    if (!moved) break;
  }
  return { x, z, hit };
}

function locate(levelData, x, z) {
  const R = levelData.ringRadii;
  const rings = levelData.rings;
  const r = Math.hypot(x, z);
  const angle = normAngle(Math.atan2(z, x));
  if (r < R[0]) return { corridor: -1, segment: -1, r, angle };
  if (r >= R[rings]) return { corridor: rings, segment: -1, r, angle };
  const i = Math.min(rings - 1, Math.max(0, Math.floor((r - R[0]) / CFG.RING_WIDTH)));
  let segment = -1;
  for (const s of levelData.segments) {
    if (s.corridor !== i) continue;
    if (s.a1 - s.a0 >= TAU - 1e-9 && s.full !== false) { segment = s.id; break; }
    if (normAngle(angle - s.a0) <= s.a1 - s.a0) { segment = s.id; break; }
  }
  return { corridor: i, segment, r, angle };
}

function inCenter(levelData, x, z) {
  return Math.hypot(x, z) < levelData.ringRadii[0] - HALF_T;
}

// ---------------------------------------------------------------- self test

function mazeSelfTest(levels = 12) {
  const problems = [];
  const seeds = [1, 42, 1337, 9001, 'kitty', 777777];
  const P = (s, l, msg) => { if (problems.length < 200) problems.push(`seed ${s} L${l}: ${msg}`); };
  const stats = { levels: 0, avgPathLen: 0, radialWalls: 0, enemies: 0, items: 0, fish: 0 };
  for (const s of seeds) {
    for (let l = 1; l <= levels; l++) {
      const ld = generateLevel(l, s);
      const p = levelParams(l);
      stats.levels++;
      // determinism
      const ld2 = generateLevel(l, s);
      if (JSON.stringify(ld) !== JSON.stringify(ld2)) P(s, l, 'not deterministic');
      // angles
      for (const a of ld.wallArcs) if (!(a.a0 >= 0 && a.a0 < TAU && a.a1 > a.a0 && a.a1 - a.a0 <= TAU + 1e-9)) P(s, l, 'bad wallArc ' + JSON.stringify(a));
      for (const g of ld.segments) if (!(g.a0 >= 0 && g.a0 < TAU && g.a1 > g.a0 && g.a1 - g.a0 <= TAU + 1e-9)) P(s, l, 'bad segment ' + JSON.stringify(g));
      for (let j = 0; j < ld.rings; j++) if (!ld.gaps.some(g => g.wall === j)) P(s, l, 'wall ' + j + ' without gap');
      if (ld.gaps.some(g => g.wall >= ld.rings)) P(s, l, 'gap in outer wall');
      // path: starts at start, ends in center, never inside walls
      const path = ld.path;
      if (path.length < 2) P(s, l, 'no path');
      else {
        if (!inCenter(ld, path[path.length - 1].x, path[path.length - 1].z)) P(s, l, 'path does not end in center');
        let len = 0, bad = 0;
        for (let k = 1; k < path.length; k++) {
          const A = path[k - 1], B = path[k];
          const sl = Math.hypot(B.x - A.x, B.z - A.z);
          len += sl;
          if (sl > 2.6) P(s, l, 'path step too long ' + sl.toFixed(2));
          const n = Math.ceil(sl / 0.2);
          for (let t = 0; t <= n; t++) {
            const x = A.x + (B.x - A.x) * t / n, z = A.z + (B.z - A.z) * t / n;
            if (collideCircle(ld, x, z, CFG.KITTY_RADIUS).hit) bad++;
          }
        }
        if (bad) P(s, l, `path hits walls at ${bad} samples`);
        stats.avgPathLen += len;
      }
      // spawn points
      for (const sp of ld.spawnPoints) {
        if (collideCircle(ld, sp.x, sp.z, CFG.KITTY_RADIUS).hit) P(s, l, 'spawn collides');
        if (locate(ld, sp.x, sp.z).corridor !== ld.rings - 1) P(s, l, 'spawn not in outer corridor');
      }
      if (ld.spawnPoints.length !== 4) P(s, l, 'spawn count');
      // enemies
      if (ld.enemies.length < p.enemyCount * 0.85) P(s, l, `few enemies ${ld.enemies.length}/${p.enemyCount}`);
      const safeA = CFG.START_SAFE_ARC / ld.ringRadii[ld.rings - 1];
      for (const e of ld.enemies) {
        if (!(e.rIn < e.rOut)) P(s, l, 'enemy rIn>=rOut ' + e.id);
        if (!(e.a0 >= 0 && e.a0 < TAU && e.a1 > e.a0 && e.a1 - e.a0 <= TAU + 1e-9)) P(s, l, 'enemy bad angles ' + e.id);
        if (!p.enemyTypes.includes(e.type)) P(s, l, 'enemy type ' + e.type);
        if ((e.type === 'patroller' || e.type === 'orbiter') && !(e.r >= e.rIn && e.r <= e.rOut)) P(s, l, 'enemy r out of bounds');
        if (e.type === 'sweeper' && !(e.angle >= e.a0 && e.angle <= e.a1)) P(s, l, 'sweeper angle out of bounds');
        if (e.type === 'orbiter') { const sg = ld.segments[e.segment]; if (!(sg.full || sg.a1 - sg.a0 >= TAU / 3 - 1e-9)) P(s, l, 'orbiter in short segment'); }
        if (!(e.speed > 0 && e.speed < CFG.KITTY_SPEED)) P(s, l, 'enemy speed ' + e.speed);
        let clip = 0, unsafe = 0;
        for (let u = 0; u <= 8; u++) for (let v = 0; v <= 4; v++) {
          const a = e.a0 + (e.a1 - e.a0) * u / 8, r = e.rIn + (e.rOut - e.rIn) * v / 4;
          const x = r * Math.cos(a), z = r * Math.sin(a);
          if (collideCircle(ld, x, z, CFG.WOLF_RADIUS).hit) clip++;
          if (e.corridor === ld.rings - 1 && Math.abs(angleDiff(a, ld.startAngle)) < safeA) unsafe++;
          if (locate(ld, x, z).corridor !== e.corridor) clip++;
        }
        if (clip) P(s, l, `enemy ${e.id} (${e.type}) bounds clip walls (${clip})`);
        if (unsafe) P(s, l, `enemy ${e.id} covers start safe arc`);
      }
      // items
      const fish = ld.items.filter(i => i.type === 'fish').length;
      if (fish < p.fishCount * 0.8) P(s, l, `few fish ${fish}/${p.fishCount}`);
      if (ld.items.length - fish < p.itemCount) P(s, l, `few items ${ld.items.length - fish}/${p.itemCount}`);
      for (const it of ld.items) {
        if (collideCircle(ld, it.x, it.z, CFG.ITEM_RADIUS).hit) P(s, l, 'item in wall ' + it.id);
        for (const sp of ld.spawnPoints) if (Math.hypot(sp.x - it.x, sp.z - it.z) < 2) P(s, l, 'item near spawn');
        const lc = locate(ld, it.x, it.z);
        if (lc.corridor < 0 || lc.corridor >= ld.rings) P(s, l, 'item outside maze');
      }
      ld.items.forEach((it, k) => { if (it.id !== k) P(s, l, 'item ids not sequential'); });
      ld.enemies.forEach((e, k) => { if (e.id !== k) P(s, l, 'enemy ids not sequential'); });
      stats.radialWalls += ld.radialWalls.length;
      stats.enemies += ld.enemies.length;
      stats.items += ld.items.length - fish;
      stats.fish += fish;
    }
  }
  stats.avgPathLen /= Math.max(1, stats.levels);
  return { ok: problems.length === 0, problems, stats };
}

return { generateLevel, collideCircle, locate, inCenter, mazeSelfTest };
})();
// ===== enemies.js =====
const { createEnemies, updateEnemies, nearestEnemyDist } = (() => {
// Wolves: deterministic enemy behaviors. Pure (no THREE, no DOM).
//
// Interpretation notes (contract ambiguities):
// - EnemySpec has no start position; the start position is derived from spec.phase + spec.seed.
// - Every enemy starts with a short phase-dependent pause (tell ramps up) so wolves crouch, then
//   go, and are out of sync with each other.
// - Patroller sub-range: arcs longer than ~6 units may use a random sub-range (>=55% of the arc),
//   and the patrolled arc is capped at 24 units so a lap stays readable on huge rings.
// - Missing/invalid spec.r -> middle of [rIn,rOut]; rOut<rIn -> both collapse to the midpoint.
// - Private per-enemy state lives in enemy._st (includes an RNG closure: not serializable;
//   network clients should replicate x/z/heading/moving/tell rather than the internal state).
// - nearestEnemyDist returns Infinity when there are no enemies; distance is clamped at >= 0.


const EASE_T = 0.15;          // accel / decel time at move start / end (s)
const TURN_RATE_PAUSE = 12;   // heading smoothing while paused (1/s)
const TURN_RATE_MOVE = 40;    // heading smoothing while moving (≈ exact after ease-in)
const TELL_WINDOW = 0.5;      // tell ramps over the last N seconds of a pause
const FULL_RING_EPS = 1e-6;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function wrapPi(a) {
  a = (a + Math.PI) % TAU;
  if (a < 0) a += TAU;
  return a - Math.PI;
}

function turnToward(h, target, k, dt) {
  return wrapPi(h + wrapPi(target - h) * (1 - Math.exp(-k * dt)));
}

// Direction (heading) of motion at polar point (r, th) when moving by (dr, dth).
function polarDir(r, th, dr, dth) {
  const c = Math.cos(th), s = Math.sin(th);
  const dx = dr * c - r * s * dth;
  const dz = dr * s + r * c * dth;
  return Math.atan2(dz, dx);
}

// Conservative length of a polar-interpolated path (uses the larger radius, so the
// instantaneous linear speed never exceeds spec.speed; exact for pure arcs / radial moves).
function pathLen(r0, th0, r1, th1) {
  return Math.hypot(r1 - r0, Math.max(r0, r1) * (th1 - th0));
}

// Trapezoidal (or triangular for short moves) speed profile with EASE_T ramps.
function profileT(L, v) {
  if (L <= 1e-5) return 0;
  if (L >= v * EASE_T) return L / v + EASE_T;
  const a = v / EASE_T;
  return 2 * Math.sqrt(L / a);
}

function profileS(t, T, L, v) {
  if (T <= 0) return L;
  const a = v / EASE_T;
  if (L >= v * EASE_T) {
    if (t < EASE_T) return 0.5 * a * t * t;
    if (t < T - EASE_T) return 0.5 * v * EASE_T + v * (t - EASE_T);
    const u = T - t;
    return L - 0.5 * a * u * u;
  }
  const tp = T * 0.5;
  if (t < tp) return 0.5 * a * t * t;
  const u = T - t;
  return L - 0.5 * a * u * u;
}

function profileV(t, T, L, v) {
  if (T <= 0) return 0;
  const a = v / EASE_T;
  if (L >= v * EASE_T) {
    if (t < EASE_T) return a * t;
    if (t < T - EASE_T) return v;
    return a * Math.max(0, T - t);
  }
  const tp = T * 0.5;
  return t < tp ? a * t : a * Math.max(0, T - t);
}

// ---------------------------------------------------------------------------

function pickWanderTarget(st) {
  const { rng, rIn, rOut, a0, a1, r, th } = st;
  for (let i = 0; i < 24; i++) {
    const d = rng.range(2, 7);
    const phi = rng.range(0, TAU);
    const tr = r + d * Math.sin(phi);
    if (tr < rIn || tr > rOut) continue;
    const rm = Math.max(0.5, 0.5 * (r + tr));
    const tth = th + (d * Math.cos(phi)) / rm;
    if (tth < a0 || tth > a1) continue;
    st.nr = tr; st.nth = tth;
    return;
  }
  // Tiny bounds fallback: random in-bounds point whose distance is closest to 4.5.
  let best = Infinity;
  st.nr = r; st.nth = th;
  for (let i = 0; i < 8; i++) {
    const tr = rng.range(rIn, rOut);
    const tth = rng.range(a0, a1);
    const score = Math.abs(pathLen(r, th, tr, tth) - 4.5);
    if (score < best) { best = score; st.nr = tr; st.nth = tth; }
  }
}

// Per-leg speed variation, capped safely below kitty speed so every wolf stays outrunnable.
function legSpeed(st, mult) {
  return Math.min(st.speed * mult, CFG.KITTY_SPEED * 0.85);
}

// Plans the next move target (st.nr, st.nth), the pause before it (st.pauseDur) and the leg speed.
// Randomness: variable pauses, per-leg speed, occasional dashes, patrollers that stop short and
// double back. The tell (crouch + glowing eyes during the pause) still telegraphs every move.
function planNext(e, initial) {
  const st = e._st;
  const rng = st.rng;
  switch (e.type) {
    case 'wanderer':
      pickWanderTarget(st);
      if (!initial) st.pauseDur = rng.chance(0.2) ? rng.range(0.12, 0.3) : rng.range(0.3, 1.1);
      st.vLeg = legSpeed(st, rng.chance(0.18) ? 1.5 : rng.range(0.75, 1.25));
      break;
    case 'sweeper': {
      if (!initial) st.toHigh = rng.chance(0.85) ? !st.toHigh : st.toHigh;
      st.k++;
      st.nr = st.toHigh ? st.rOut : rng.chance(0.5) ? st.rIn : rng.range(st.rIn, st.rOut);
      if (Math.abs(st.nr - st.r) < 1) st.nr = st.r > 0.5 * (st.rIn + st.rOut) ? st.rIn : st.rOut;
      st.nth = clamp(st.center + st.amp * rng.range(-1, 1), st.a0, st.a1);
      if (!initial) st.pauseDur = rng.range(0.15, 0.7);
      st.vLeg = legSpeed(st, rng.range(0.8, 1.3));
      break;
    }
    case 'orbiter':
    case 'patroller':
    default: {
      const eps = 1e-4;
      const isOrb = e.type === 'orbiter';
      if (!initial) {
        if (st.th >= st.pa1 - eps) st.toHigh = false;
        else if (st.th <= st.pa0 + eps) st.toHigh = true;
        else st.toHigh = rng.chance(isOrb ? 0.7 : 0.5) ? !st.toHigh : st.toHigh;
      }
      const end = st.toHigh ? st.pa1 : st.pa0;
      st.nr = isOrb ? st.r : clamp(st.r + rng.range(-0.8, 0.8), st.rIn, st.rOut);
      const remain = Math.abs(end - st.th) * Math.max(0.5, st.r);
      // ~40% of legs stop short somewhere along the way (if there is room), then pick a new direction.
      if (!initial && remain > 4 && rng.chance(isOrb ? 0.25 : 0.4)) {
        st.nth = st.th + (end - st.th) * rng.range(0.3, 0.75);
      } else {
        st.nth = end;
      }
      if (!initial) st.pauseDur = rng.range(isOrb ? 0.2 : 0.18, isOrb ? 0.6 : 0.8);
      st.vLeg = legSpeed(st, rng.range(0.8, 1.3));
      break;
    }

  // Higher levels: shorter rests (spec.pauseScale < 1), but always leave a brief readable tell.
  if (!initial) st.pauseDur = Math.max(0.12, st.pauseDur * st.pauseScale);
}

function startMove(e) {
  const st = e._st;
  st.mode = 'move';
  st.t = 0;
  st.r0 = st.r; st.th0 = st.th;
  st.r1 = st.nr; st.th1 = st.nth;
  st.L = pathLen(st.r0, st.th0, st.r1, st.th1);
  st.T = profileT(st.L, st.vLeg);
}

function arrive(e) {
  const st = e._st;
  st.r = st.r1; st.th = st.th1;
  st.mode = 'pause';
  st.t = 0;
  planNext(e, false);
}

function place(e, r, th) {
  e.x = r * Math.cos(th);
  e.z = r * Math.sin(th);
}

function createEnemy(spec) {

  const fixedR = clamp(Number.isFinite(spec.r) ? spec.r : rMid, rIn, rOut);
  const fullRing = (a1 - a0) >= TAU - FULL_RING_EPS;

    rng, rIn, rOut, a0, a1, phase, speed, fullRing,
    r: rMid, th: a0, mode: 'pause', t: 0, pauseDur: 0,
    nr: rMid, nth: a0, r0: 0, th0: 0, r1: 0, th1: 0, L: 0, T: 0,
    toHigh: true, pa0: a0, pa1: a1, center: a0, amp: 0, k: 0, v: 0, dir: 1,
    vLeg: speed, orbitLeft: 0, ot: 0, nextDir: 1,
    pauseScale: Number.isFinite(spec.pauseScale) ? spec.pauseScale : 1,
  };

    id: spec.id, type: spec.type, spec,
    x: 0, z: 0, heading: 0,
    radius: CFG.WOLF_RADIUS,
    moving: false, tell: 0, speedNow: 0,
    _st: st,
  };

  switch (spec.type) {
    case 'orbiter': {
      st.r = fixedR;
      st.dir = spec.dir < 0 ? -1 : 1;
      if (fullRing) {
        st.mode = 'orbit';
        st.th = a0 + phase * TAU;
        st.v = 0;
        st.orbitLeft = rng.range(2.5, 8);
        e.heading = wrapPi(polarDir(st.r, st.th, 0, st.dir));
        place(e, st.r, st.th);
        return e;

      st.th = a0 + phase * (a1 - a0);
      st.pa0 = a0; st.pa1 = a1;
      st.toHigh = st.dir > 0;
      st.pauseDur = initialPause;

      st.r = rng.range(rIn, rOut);

      st.r = rIn + phase * (rOut - rIn);

      st.toHigh = rng.chance(0.5);

      st.r = fixedR;

      if (arcLen > 6) subLen = rng.range(Math.max(6, 0.55 * arcLen), arcLen);

      const subSpan = Math.min(span, subLen / Math.max(0.5, st.r));
      st.pa0 = a0 + rng.range(0, Math.max(0, (a1 - a0) - subSpan));
      st.pa1 = st.pa0 + subSpan;
      st.th = st.pa0 + phase * subSpan;
      st.toHigh = rng.chance(0.5);
      st.pauseDur = initialPause;
      break;
    }

  e.heading = facingNext(st, e.heading);
  place(e, st.r, st.th);
  return e;
}

// Heading toward the planned next move (or `fallback` if the next move is ~zero length).
function facingNext(st, fallback) {
  const dr = st.nr - st.r, dth = st.nth - st.th;
  if (Math.abs(dr) + Math.abs(dth) * st.r < 1e-4) return fallback;
  return wrapPi(polarDir(st.r, st.th, dr, dth));
}

function stepEnemy(e, dt) {
  const st = e._st;

  if (st.mode === 'orbit' || st.mode === 'orbitPause') {
    // Full-ring orbiter: cruising speed surges and slows; every few seconds it brakes, crouches
    // (tell) and either reverses or carries on.
    st.ot += dt;
    if (st.mode === 'orbit') {
      const surge = 1 + 0.25 * Math.sin(st.ot * 0.9 + st.phase * TAU) * Math.sin(st.ot * 0.37 + 1.3);
      const vTarget = legSpeed(st, surge);
      st.v = st.v < vTarget ? Math.min(vTarget, st.v + (st.speed / EASE_T) * dt) : Math.max(vTarget, st.v - st.speed * dt);
      st.orbitLeft -= dt;
      if (st.orbitLeft <= 0) {
        st.mode = 'orbitPause';
        st.t = 0;
        st.pauseDur = Math.max(0.2, st.rng.range(0.45, 1.0) * st.pauseScale);
        st.nextDir = st.rng.chance(0.55) ? -st.dir : st.dir;
      }
      e.tell = 0;
    } else {
      st.v = Math.max(0, st.v - (st.speed / (EASE_T * 2)) * dt);
      st.t += dt;
      const win = Math.min(st.pauseDur, TELL_WINDOW);
      const x = clamp((st.t - (st.pauseDur - win)) / win, 0, 1);
      e.tell = st.v > 0 ? 0 : x * x * (3 - 2 * x);
      if (st.t >= st.pauseDur && st.v <= 0) {
        st.dir = st.nextDir;
        st.mode = 'orbit';
        st.orbitLeft = st.rng.range(2.5, 8);
      }
    }
    st.th += (st.dir * st.v / Math.max(0.5, st.r)) * dt;
    st.th = st.a0 + (((st.th - st.a0) % TAU) + TAU) % TAU;
    e.moving = st.v > 0.05;
    e.speedNow = st.v;
    const faceDir = st.mode === 'orbitPause' && st.v <= 0 ? st.nextDir : st.dir;
    e.heading = turnToward(e.heading, polarDir(st.r, st.th, 0, faceDir), st.v > 0 ? TURN_RATE_MOVE : TURN_RATE_PAUSE, dt);
    place(e, st.r, st.th);
    return;
  }

  let rem = dt;
  for (let guard = 0; rem > 0 && guard < 8; guard++) {
    if (st.mode === 'pause') {
      const left = st.pauseDur - st.t;
      if (rem < left) { st.t += rem; rem = 0; break; }
      rem -= Math.max(0, left);
      startMove(e);
    } else {
      const left = st.T - st.t;
      if (rem < left) { st.t += rem; rem = 0; break; }
      rem -= Math.max(0, left);
      arrive(e);
    }
  }
  if (rem > 0) st.t += rem;

  let r, th;
  if (st.mode === 'move') {
    const s = profileS(st.t, st.T, st.L, st.vLeg);
    const f = st.L > 0 ? clamp(s / st.L, 0, 1) : 1;
    r = st.r0 + (st.r1 - st.r0) * f;
    th = st.th0 + (st.th1 - st.th0) * f;
    e.moving = true;
    e.tell = 0;
    e.speedNow = profileV(st.t, st.T, st.L, st.vLeg);
    if (st.L > 1e-5) {
      const dir = polarDir(r, th, st.r1 - st.r0, st.th1 - st.th0);
      e.heading = turnToward(e.heading, dir, TURN_RATE_MOVE, dt);
    }
  } else {
    r = st.r; th = st.th;
    e.moving = false;
    e.speedNow = 0;
    const win = Math.min(st.pauseDur, TELL_WINDOW);
    const x = win > 0 ? clamp((st.t - (st.pauseDur - win)) / win, 0, 1) : 1;
    e.tell = x * x * (3 - 2 * x);
    e.heading = turnToward(e.heading, facingNext(st, e.heading), TURN_RATE_PAUSE, dt);
  }
  r = clamp(r, st.rIn, st.rOut);
  th = clamp(th, st.a0, st.a1);
  place(e, r, th);
}

// ---------------------------------------------------------------------------

function createEnemies(levelData) {
  const specs = (levelData && levelData.enemies) || [];
  const out = [];
  for (const spec of specs) out.push(createEnemy(spec));
  return out;
}

function updateEnemies(enemies, levelData, dt) {
  if (!(dt > 0)) return;
  for (let i = 0; i < enemies.length; i++) stepEnemy(enemies[i], dt);
}

// Distance from (x, z) to the nearest enemy's body edge (>= 0). Infinity if none.
function nearestEnemyDist(enemies, x, z) {
  let best = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const d = Math.hypot(e.x - x, e.z - z) - e.radius;
    if (d < best) best = d;
  }
  return best < 0 ? 0 : best;
}

return { createEnemies, updateEnemies, nearestEnemyDist };

// ===== sim.js =====
const { createSim, stepSim, simSummary, addPlayer, removePlayer } = (() => {
// Deterministic game simulation core. Pure: no THREE, no DOM, no Math.random, no Date.
// stepSim is the only mutator. All state lives in the Sim object (plain data).
//
// Interpretations / extra fields (beyond CONTRACTS.md):
// - sim.started (bool): false until the first stepSim, which emits levelStart.
// - sim.enteredCenter: array of playerIds that already emitted enterCenter this level.
// - Players already inCenter are clamped to stay inside the center disc.
// - On level transition, shield is reset to 0 silently (no shieldEnd event).
// - Spawn index = player index modulo spawnPoints.length (small offset if more players than points).
// - Pickup 'life' when lives are already at MAX_EXTRA_LIVES is left on the ground.
// - Game over only triggers if there is at least one player in the sim.
// - Velocity component pointing into a wall is removed after collision (smooth sliding).
// - Extra exports: simSummary, addPlayer, removePlayer.


const MAX_SUBSTEP_DISP = 0.25;
const MAX_SUBSTEPS = 64;

function makeLevel(sim, level) {
  sim.level = level;
  sim.levelData = generateLevel(level, hashSeed(sim.seed, level));
  sim.enemies = createEnemies(sim.levelData);
  const src = sim.levelData.items || [];
  const items = [];
  for (let i = 0; i < src.length; i++) {
    const it = src[i];
    items.push({ id: it.id, type: it.type, x: it.x, z: it.z, taken: false });
  }
  sim.items = items;
  sim.circles = [];
  sim.enteredCenter = [];
  sim.levelTime = 0;
  sim.state = 'playing';
  sim.stateTimer = 0;
  if (level > sim.stats.bestLevel) sim.stats.bestLevel = level;
}

function spawnPoint(levelData, index) {
  const pts = levelData.spawnPoints || [];
  if (pts.length === 0) {
    const R = levelData.ringRadii;
    const r = (R[R.length - 1] + R[R.length - 2]) * 0.5;
    const a = levelData.startAngle || 0;
    return { x: r * Math.cos(a), z: r * Math.sin(a), heading: a + Math.PI / 2 };
  }
  const p = pts[index % pts.length];
  const round = Math.floor(index / pts.length);
  if (round === 0) return { x: p.x, z: p.z, heading: p.heading };
  // more players than spawn points: nudge along heading
  const off = 0.9 * round;
  return { x: p.x + Math.cos(p.heading) * off, z: p.z + Math.sin(p.heading) * off, heading: p.heading };
}

function placeAtSpawn(sim, p, index) {
  const sp = spawnPoint(sim.levelData, index);
  p.x = sp.x;
  p.z = sp.z;
  p.heading = sp.heading;
  p.vx = 0;
  p.vz = 0;
  p.moving = false;
  p.alive = true;
  p.invuln = CFG.SPAWN_INVULN;
  p.shield = 0;
  p.inCenter = false;
}

function makePlayer(def) {
  return {
    id: def.id,
    name: def.name,
    color: def.color,
    x: 0, z: 0, vx: 0, vz: 0, heading: 0, moving: false,
    alive: true,
    lives: 0,
    speedMult: 1,
    invuln: CFG.SPAWN_INVULN,
    shield: 0,
    inCenter: false,
    deaths: 0,
    rescues: 0,
    fish: 0,
  };
}

function createSim({ seed, players = [], startLevel = 1 } = {}) {
  const lvl = Math.max(1, startLevel | 0);
  const sim = {
    seed: seed == null ? 0 : seed,
    level: lvl,
    time: 0,
    levelTime: 0,
    levelData: null,
    enemies: [],
    players: [],
    items: [],
    circles: [],
    state: 'playing',
    stateTimer: 0,
    stats: { rescues: 0, deaths: 0, fish: 0, levelsCleared: 0, bestLevel: lvl },
    started: false,
    enteredCenter: [],
  };
  makeLevel(sim, lvl);
  for (let i = 0; i < players.length; i++) {
    const p = makePlayer(players[i]);
    placeAtSpawn(sim, p, i);
    sim.players.push(p);
  }

}

function readInput(inputs, id) {
  const inp = inputs ? inputs[id] : null;
  if (!inp) return { x: 0, z: 0 };
  let x = Number.isFinite(inp.x) ? inp.x : 0;
  let z = Number.isFinite(inp.z) ? inp.z : 0;
  const m2 = x * x + z * z;
  if (m2 > 1) {
    const m = Math.sqrt(m2);
    x /= m;
    z /= m;
  }
  return { x, z };
}

function movePlayer(sim, p, inp, dt) {
  const ld = sim.levelData;
  const maxSpeed = CFG.KITTY_SPEED * p.speedMult;
  const tx = inp.x * maxSpeed;
  const tz = inp.z * maxSpeed;
  const curSpeed = Math.sqrt(p.vx * p.vx + p.vz * p.vz);
  const tgtSpeed = Math.sqrt(tx * tx + tz * tz);
  const estDisp = Math.max(curSpeed, tgtSpeed) * dt;
  let n = Math.ceil(estDisp / MAX_SUBSTEP_DISP);
  if (!(n >= 1)) n = 1;
  if (n > MAX_SUBSTEPS) n = MAX_SUBSTEPS;
  const h = dt / n;
  const k = 1 - Math.exp(-h / CFG.KITTY_ACCEL_TAU);
  const wasInCenter = p.inCenter;
  const maxCenterR = ld.ringRadii[0] - CFG.WALL_THICKNESS / 2 - 0.05;

  for (let s = 0; s < n; s++) {
    p.vx += (tx - p.vx) * k;
    p.vz += (tz - p.vz) * k;
    const nx = p.x + p.vx * h;
    const nz = p.z + p.vz * h;
    const c = collideCircle(ld, nx, nz, CFG.KITTY_RADIUS);
    let cx = c.x;
    let cz = c.z;
    if (c.hit) {
      const px = cx - nx;
      const pz = cz - nz;
      const pl = Math.sqrt(px * px + pz * pz);
      if (pl > 1e-6) {
        const ux = px / pl;
        const uz = pz / pl;
        const vn = p.vx * ux + p.vz * uz;
        if (vn < 0) {
          p.vx -= vn * ux;
          p.vz -= vn * uz;
        }
      }
    }
    if (wasInCenter) {
      // stay inside the center disc
      const r = Math.sqrt(cx * cx + cz * cz);
      if (r > maxCenterR && r > 1e-6) {
        const ux = cx / r;
        const uz = cz / r;
        cx = ux * maxCenterR;
        cz = uz * maxCenterR;
        const vn = p.vx * ux + p.vz * uz;
        if (vn > 0) {
          p.vx -= vn * ux;
          p.vz -= vn * uz;
        }
      }
    }
    p.x = cx;
    p.z = cz;
  }

  const speed = Math.sqrt(p.vx * p.vx + p.vz * p.vz);
  if (speed > 0.3) p.heading = Math.atan2(p.vz, p.vx);
  p.moving = speed > 0.5;
}

function nextLevel(sim, events) {
  makeLevel(sim, sim.level + 1);
  for (let i = 0; i < sim.players.length; i++) {
    placeAtSpawn(sim, sim.players[i], i);
  }
  events.push({ type: 'levelStart', level: sim.level });

function stepSim(sim, inputs, dt) {

      dead.x = circ.x;
      dead.z = circ.z;
      dead.vx = 0;
      dead.vz = 0;

      dead.inCenter = false;

const _q = new THREE.Quaternion();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();
const _c = new THREE.Color();

function mtx(p, r, s) {
  const m = new THREE.Matrix4();
  _e.set(r ? r[0] : 0, r ? r[1] : 0, r ? r[2] : 0);
  _q.setFromEuler(_e);

function bake(parts) {
  const pos = [];

    const g = c.getContext('2d');
    let seed = 1337;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    g.translate(S / 2, S / 2);

    const R = S / 2;

      for (let k = 0; k < strokes; k++) {

  const whiskers = new THREE.LineSegments(whiskerGeo(), whiskerMat);
  head.add(whiskers);

  // legs: 0 FL, 1 FR, 2 BL, 3 BR
  const legs = [];
  const hips = [[0.12, 0.25, 0.105], [0.12, 0.25, -0.105], [-0.2, 0.25, 0.105], [-0.2, 0.25, -0.105]];
  for (const h of hips) {
    const p = new THREE.Group();
    p.position.set(h[0], h[1], h[2]);
    rig.add(p);
    mk(G.leg, p, true);
    legs.push(p);
  }

  // tail chain
  const tailRoot = new THREE.Group();
  tailRoot.position.set(-0.32, 0.4, 0);
  rig.add(tailRoot);
  const tail = [];
  const N_TAIL = 6, SEG_LEN = 0.085;
  let parent = tailRoot;
  for (let i = 0; i < N_TAIL; i++) {
    const seg = new THREE.Group();
    if (i > 0) seg.position.y = SEG_LEN;
    parent.add(seg);
    const m = mk(i === N_TAIL - 1 ? G.tailTip : G.tailSeg, seg, i < 3);
    const taper = 1 - i * 0.07;
    m.scale.set(taper, 1, taper);
    tail.push(seg);
    parent = seg;
  }

  // shield bubble
  const bubbleMat = makeFresnelMaterial(0x7fd6ff, 1);
  const bubble = new THREE.Mesh(cgeo('sphere24', () => new THREE.SphereGeometry(1, 24, 16)), bubbleMat);
  bubble.position.y = 0.4;
  bubble.visible = false;
  bubble.renderOrder = 5;
  group.add(bubble);

  const seedOff = Math.random() * 100;
  let phase = 0, runAmt = 0, clock = 0;
  let blinkT = 0, nextBlink = 1.5 + Math.random() * 3;
  let earT = 0, nextEar = 2 + Math.random() * 4, earSide = 0;
  let shieldAmt = 0;
  let ghost = false;

  function update(dt, s) {
    s = s || {};
    dt = Math.min(dt || 0, 0.1);
    clock += dt;
    const time = s.time !== undefined ? s.time : clock;
    const moving = !!s.moving;
    const sp = s.speed01 === undefined ? (moving ? 1 : 0) : Math.max(0, Math.min(1, s.speed01));
    runAmt = smoothTo(runAmt, moving ? Math.max(0.35, sp) : 0, 10, dt);
    phase += dt * (10 + 8 * sp) * (runAmt > 0.01 ? 1 : 0);
    const sn = Math.sin(phase);
    const idle = 1 - Math.min(1, runAmt);
    const breath = Math.sin(time * 2.6 + seedOff);

    // legs (diagonal pairs)
    const amp = 0.95 * runAmt;
    legs[0].rotation.z = sn * amp;
    legs[3].rotation.z = sn * amp * 0.9;
    legs[1].rotation.z = -sn * amp;
    legs[2].rotation.z = -sn * amp * 0.9;

    // body bob + squash/stretch
    const bounce = Math.abs(Math.sin(phase));
    const sq = Math.cos(phase * 2) * 0.07 * runAmt;
    rig.position.y = bounce * 0.07 * runAmt;
    const by = 1 - sq + breath * 0.022 * idle;
    rig.scale.set(1 + sq * 0.5, by, 1 + sq * 0.4 - breath * 0.01 * idle);
    rig.rotation.z = -0.1 * runAmt + Math.sin(phase * 2) * 0.03 * runAmt;
    bodyMesh.position.y = 0;

    // head counter-bob + idle look
    head.position.y = K_HEAD_POS[1] - bounce * 0.045 * runAmt + 0.025 * runAmt;
    head.rotation.z = 0.1 * runAmt + Math.sin(phase * 2 + 0.6) * 0.05 * runAmt + Math.sin(time * 0.9 + seedOff) * 0.05 * idle;
    head.rotation.x = Math.sin(time * 0.55 + seedOff) * 0.12 * idle;
    head.rotation.y = Math.sin(time * 0.37 + seedOff * 2) * 0.2 * idle;

    // ears: flatten back when running, occasional twitch at idle
    earT -= dt;
    if (earT <= 0 && clock > nextEar) { earT = 0.18; nextEar = clock + 2 + Math.random() * 4; earSide = Math.random() < 0.5 ? 0 : 1; }
    for (let i = 0; i < 2; i++) {
      const sz = i === 0 ? 1 : -1;
      const tw = earT > 0 && earSide === i ? Math.sin((0.18 - earT) / 0.18 * Math.PI) * 0.5 : 0;
      ears[i].rotation.z = 0.35 * runAmt + tw * 0.6;
      ears[i].rotation.x = (0.38 + 0.15 * runAmt + tw * 0.3) * sz;
    }

    // tail: lagging swish
    tailRoot.rotation.z = 0.95 + 0.6 * runAmt;
    for (let i = 0; i < tail.length; i++) {
      const lag = i * 0.55;
      tail[i].rotation.x = Math.sin(phase * 0.5 - lag) * 0.28 * runAmt + Math.sin(time * 1.7 + seedOff - lag) * 0.2 * idle;
      tail[i].rotation.z = i === 0 ? 0 : (-0.26 * (1 - runAmt * 0.6) + Math.sin(phase - lag) * 0.08 * runAmt);
    }

    // blink
    if (!ghost) {
      if (blinkT > 0) blinkT -= dt;
      else if (clock > nextBlink) { blinkT = 0.13; nextBlink = clock + 2 + Math.random() * 3.5; }
      eyes.scale.y = blinkT > 0 ? 0.12 : 1;
    }

    // invulnerability blink
    const inv = s.invuln || 0;
    rig.visible = !(inv > 0 && Math.floor(time * 12) % 2 === 1);

    // shield
    const sh = s.shield || 0;
    shieldAmt = smoothTo(shieldAmt, sh > 0 ? 1 : 0, sh > 0 ? 14 : 8, dt);
    bubble.visible = shieldAmt > 0.02;
    if (bubble.visible) {
      const wob = 1 + Math.sin(time * 6) * 0.03;
      const pop = shieldAmt < 1 ? (1 + (1 - shieldAmt) * 0.25) : 1;
      bubble.scale.set(0.62 * wob * pop * shieldAmt, 0.6 * pop * (2 - wob) * shieldAmt, 0.62 * wob * pop * shieldAmt);
      bubble.rotation.y = time * 0.8;
      let op = shieldAmt;
      if (sh > 0 && sh < 1.2) op *= Math.sin(time * 28) > 0 ? 1 : 0.35;
      bubbleMat.uniforms.uOpacity.value = op;
      bubbleMat.uniforms.uTime.value = time;
    }
  }

  function setGhost(on, tint) {
    ghost = !!on;
    const gm = ghostMaterial(tint);
    for (const m of meshes) {
      m.material = ghost ? gm : mat;
      m.castShadow = ghost ? false : (m.userData.shadow !== undefined ? m.userData.shadow : m.castShadow);
    }
    whiskers.visible = !ghost;
    eyes.scale.y = ghost ? 0.12 : 1;
  }
  for (const m of meshes) m.userData.shadow = m.castShadow;

  update(0, {});
  return { group, update, setGhost };
}

const WOLF_TYPES = {
  patroller: { base: 0x8a909c, light: 0xd8dce4, dark: 0x464b57, accent: 0xffc23d },
  wanderer: { base: 0x8c5a38, light: 0xdcb48a, dark: 0x45291a, accent: 0xff8a2a },
  orbiter: { base: 0x3e5088, light: 0x9fb2e0, dark: 0x1d2548, accent: 0x52d6ff },
  sweeper: { base: 0xa83c33, light: 0xeaa58e, dark: 0x51201b, accent: 0xff3a3a },
};

function wolfGeos(type) {
  return cgeo('wolf:' + type, () => {
    const T = WOLF_TYPES[type];
    const { base, light, dark } = T;
    const body = [
      [P.ico1, mtx([-0.08, 0.6, 0], null, [0.46, 0.23, 0.24]), base],
      [P.ico1, mtx([0.24, 0.63, 0], null, [0.26, 0.29, 0.26]), base],
      [P.ico0, mtx([0.36, 0.55, 0], [0, 0, 0.3], [0.18, 0.22, 0.19]), light],
      [P.ico1, mtx([-0.05, 0.51, 0], null, [0.36, 0.13, 0.18]), light],
      [P.ico1, mtx([-0.04, 0.71, 0], null, [0.42, 0.11, 0.16]), dark],
      [P.ico1, mtx([-0.36, 0.57, 0.12], null, [0.17, 0.2, 0.12]), base],
      [P.ico1, mtx([-0.36, 0.57, -0.12], null, [0.17, 0.2, 0.12]), base],
      [P.ico1, mtx([0.3, 0.55, 0.13], null, [0.13, 0.18, 0.12]), base],
      [P.ico1, mtx([0.3, 0.55, -0.13], null, [0.13, 0.18, 0.12]), base],
    ];
    // spiky scruff along the back
    const spikes = [[0.36, 0.86, 0.09], [0.22, 0.88, 0.1], [0.08, 0.81, 0.08], [-0.08, 0.77, 0.07], [-0.24, 0.75, 0.06]];
    for (const [x, y, s] of spikes) body.push([P.cone4, mtx([x, y, 0], [0, Math.PI / 4, 0.75], [s * 0.8, s * 2.1, s * 0.8]), dark]);
    for (const sz of [1, -1]) body.push([P.cone4, mtx([0.32, 0.8, 0.12 * sz], [0.5 * sz, 0, 0.6], [0.06, 0.16, 0.06]), base]);

    const head = bake([
      [P.ico1, mtx([0, 0, 0], null, [0.2, 0.17, 0.18]), base],
      [P.ico1, mtx([-0.02, 0.075, 0], null, [0.15, 0.09, 0.13]), dark],
      [P.ico0, mtx([-0.05, -0.07, 0.13], null, [0.1, 0.08, 0.07]), light],
      [P.ico0, mtx([-0.05, -0.07, -0.13], null, [0.1, 0.08, 0.07]), light],
      [P.cone5, mtx([0.26, -0.035, 0], [0, 0, -Math.PI / 2], [0.105, 0.4, 0.095]), base],
      [P.ico1, mtx([0.2, -0.08, 0], null, [0.17, 0.045, 0.08]), light],
      [P.ico0, mtx([0.455, -0.03, 0], null, [0.05, 0.045, 0.05]), 0x161318],
      // ears
      [P.cone4, mtx([-0.06, 0.24, 0.1], [0.3, Math.PI / 4, 0], [0.085, 0.24, 0.075]), dark],
      [P.cone4, mtx([-0.06, 0.24, -0.1], [-0.3, Math.PI / 4, 0], [0.085, 0.24, 0.075]), dark],
      [P.cone4, mtx([-0.04, 0.22, 0.1], [0.3, Math.PI / 4, 0], [0.05, 0.16, 0.045]), light],
      [P.cone4, mtx([-0.04, 0.22, -0.1], [-0.3, Math.PI / 4, 0], [0.05, 0.16, 0.045]), light],
      // angry brows
      [P.box, mtx([0.12, 0.09, 0.1], [0.25, 0, -0.45], [0.14, 0.035, 0.05]), dark],
      [P.box, mtx([0.12, 0.09, -0.1], [-0.25, 0, -0.45], [0.14, 0.035, 0.05]), dark],
      // fangs
      [P.cone4, mtx([0.33, -0.105, 0.045], [Math.PI, 0, 0], [0.018, 0.06, 0.018]), 0xffffff],
      [P.cone4, mtx([0.33, -0.105, -0.045], [Math.PI, 0, 0], [0.018, 0.06, 0.018]), 0xffffff],
    ]);
    const eyes = bake([
      [P.ico0, mtx([0.13, 0.035, 0.13], [0.3, -0.5, -0.3], [0.065, 0.034, 0.045]), 0xffffff],
      [P.ico0, mtx([0.13, 0.035, -0.13], [-0.3, 0.5, -0.3], [0.065, 0.034, 0.045]), 0xffffff],
    ]);
    const jaw = bake([
      [P.cone4, mtx([0.16, 0, 0], [0, Math.PI / 4, -Math.PI / 2], [0.065, 0.3, 0.065]), light],
      [P.cone4, mtx([0.22, 0.035, 0.03], null, [0.012, 0.04, 0.012]), 0xffffff],
      [P.cone4, mtx([0.22, 0.035, -0.03], null, [0.012, 0.04, 0.012]), 0xffffff],
    ]);
    const leg = bake([
      [P.ico1, mtx([0, -0.03, 0], null, [0.09, 0.1, 0.08]), base],
      [P.cyl6, mtx([0, -0.22, 0], null, [0.058, 0.42, 0.058]), base],
      [P.ico1, mtx([0.025, -0.455, 0], null, [0.08, 0.05, 0.07]), dark],
    ]);
    const tail = [
      bake([[P.ico1, mtx([0, 0.08, 0], null, [0.09, 0.12, 0.09]), base]]),
      bake([[P.ico1, mtx([0, 0.09, 0], null, [0.125, 0.16, 0.12]), base], [P.ico0, mtx([0.03, 0.06, 0], [0, 0, 0.4], [0.1, 0.12, 0.13]), dark]]),
      bake([[P.ico1, mtx([0, 0.06, 0], null, [0.1, 0.12, 0.1]), base], [P.ico1, mtx([0, 0.15, 0], null, [0.075, 0.1, 0.075]), light], [P.cone5, mtx([0, 0.26, 0], null, [0.045, 0.1, 0.045]), light]]),
    ];
    return { body: bake(body), head, eyes, jaw, leg, tail };
  });
}

function createWolfModel(type) {
  if (!WOLF_TYPES[type]) type = 'patroller';
  const T = WOLF_TYPES[type];
  const G = wolfGeos(type);
  const mat = VC_MAT();
  const group = new THREE.Group();
  group.name = 'wolf';
  const rig = new THREE.Group();
  group.add(rig);

  const body = new THREE.Mesh(G.body, mat); body.castShadow = true; rig.add(body);
  const head = new THREE.Group(); head.position.set(0.5, 0.8, 0); rig.add(head);
  const headMesh = new THREE.Mesh(G.head, mat); headMesh.castShadow = true; head.add(headMesh);

  const accent = new THREE.Color(T.accent);
  const eyeMat = new THREE.MeshBasicMaterial({ color: accent.clone() });
  const eyes = new THREE.Mesh(G.eyes, eyeMat); head.add(eyes);
  const jaw = new THREE.Group(); jaw.position.set(0.08, -0.09, 0); head.add(jaw);
  jaw.add(new THREE.Mesh(G.jaw, mat));

  const legs = [];
  const hips = [[0.3, 0.5, 0.13], [0.3, 0.5, -0.13], [-0.36, 0.5, 0.13], [-0.36, 0.5, -0.13]];
  for (const h of hips) {
    const p = new THREE.Group(); p.position.set(h[0], h[1], h[2]); rig.add(p);
    const m = new THREE.Mesh(G.leg, mat); m.castShadow = true; p.add(m);
    legs.push(p);
  }

  const tailRoot = new THREE.Group(); tailRoot.position.set(-0.5, 0.66, 0); rig.add(tailRoot);
  const tail = [];
  let parent = tailRoot;
  for (let i = 0; i < 3; i++) {
    const seg = new THREE.Group();
    if (i > 0) seg.position.y = i === 1 ? 0.13 : 0.17;
    parent.add(seg);
    const m = new THREE.Mesh(G.tail[i], mat); if (i === 1) m.castShadow = true; seg.add(m);
    tail.push(seg); parent = seg;
  }

  // ground ring (type color) for readability from above
  const ringMat = new THREE.MeshBasicMaterial({ color: glowColor(T.accent, 1.2), transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending });
  const ring = new THREE.Mesh(cgeo('wolfRing', () => flatRing(0.62, 0.72, 28)), ringMat);
  ring.position.y = 0.025;
  ring.renderOrder = 1;
  group.add(ring);

  const seedOff = Math.random() * 100;
  let phase = Math.random() * 6, runAmt = 0, tellS = 0, clock = 0;

  function update(dt, s) {
    s = s || {};
    dt = Math.min(dt || 0, 0.1);
    clock += dt;
    const time = s.time !== undefined ? s.time : clock;
    const moving = !!s.moving;
    const sp = s.speed01 === undefined ? (moving ? 1 : 0) : Math.max(0, Math.min(1, s.speed01));
    runAmt = smoothTo(runAmt, moving ? Math.max(0.45, sp) : 0, 9, dt);
    tellS = smoothTo(tellS, Math.max(0, Math.min(1, s.tell || 0)), 14, dt);
    const tell = tellS;
    phase += dt * (7 + 7 * sp) * (runAmt > 0.01 ? 1 : 0);
    const sn = Math.sin(phase);
    const idle = (1 - Math.min(1, runAmt)) * (1 - tell);

    // trot + crouch (legs splay to lower the body)
    const amp = 0.7 * runAmt;
    const crouch = 0.6 * tell;
    legs[0].rotation.z = sn * amp + crouch;
    legs[3].rotation.z = sn * amp - crouch;
    legs[1].rotation.z = -sn * amp + crouch;
    legs[2].rotation.z = -sn * amp - crouch;
    const drop = 0.5 * (1 - Math.cos(crouch));
    let jitter = 0;
    if (tell > 0.55) jitter = Math.sin(time * 75 + seedOff) * 0.014 * (tell - 0.55) / 0.45;
    rig.position.set(jitter, -drop + Math.abs(Math.cos(phase)) * 0.045 * runAmt - 0.02 * runAmt + Math.sin(time * 2 + seedOff) * 0.006 * idle, 0);
    rig.rotation.z = Math.sin(phase * 2) * 0.025 * runAmt - 0.05 * runAmt - 0.06 * tell;

    head.position.y = 0.8 - 0.06 * tell + Math.sin(phase * 2 + 1) * 0.02 * runAmt;
    head.position.x = 0.5 + 0.04 * tell;
    head.rotation.z = -0.32 * tell - 0.08 * runAmt + Math.sin(time * 0.8 + seedOff) * 0.06 * idle;
    head.rotation.y = Math.sin(time * 0.5 + seedOff) * 0.35 * idle;
    jaw.rotation.z = -0.38 * tell + (tell > 0.6 ? Math.sin(time * 30) * 0.06 : 0) - 0.08 * runAmt * (0.5 + 0.5 * Math.sin(phase * 2));

    // tail: raises stiff during tell, sways when trotting
    tailRoot.rotation.z = 2.05 - 0.45 * tell - 0.15 * runAmt;
    for (let i = 0; i < tail.length; i++) {
      tail[i].rotation.x = Math.sin(phase - i * 0.7) * 0.25 * runAmt + Math.sin(time * 1.3 + seedOff - i * 0.6) * 0.15 * idle + Math.sin(time * 40 - i) * 0.04 * tell;
      if (i > 0) tail[i].rotation.z = -0.35 + 0.25 * tell;
    }

    // glowing eyes 1 -> 4
    const ei = 1 + 3 * tell;
    eyeMat.color.copy(accent).multiplyScalar(ei);
    const es = 1 + 0.25 * tell;
    eyes.scale.set(es, es, es);

    ringMat.opacity = 0.32 + 0.55 * tell;
    const rs = 1 + 0.12 * tell + 0.03 * Math.sin(time * 3 + seedOff);
    ring.scale.set(rs, 1, rs);
  }

  update(0, {});
  return { group, update };
}

function itemDisc(type) {

function bootGeos() {
  return cgeo('boots', () => {
    const red = 0xe2493b, sole = 0x5a3426, cuff = 0xffd36b, lace = 0xfff3e0;
    const boot = bake([
      [P.box, mtx([-0.03, 0.12, 0], null, [0.16, 0.26, 0.15]), red],
      [P.ico1, mtx([0.08, -0.02, 0], null, [0.17, 0.09, 0.09]), red],
      [P.box, mtx([0.03, -0.085, 0], null, [0.34, 0.04, 0.17]), sole],
      [P.cyl8, mtx([-0.03, 0.26, 0], null, [0.11, 0.06, 0.11]), cuff],
      [P.box, mtx([0.06, 0.07, 0], [0, 0, 0.6], [0.02, 0.1, 0.12]), lace],
    ]);
    const s = new THREE.Shape();
    s.moveTo(0, 0);
    s.quadraticCurveTo(-0.06, 0.24, -0.3, 0.32);
    s.lineTo(-0.24, 0.23); s.lineTo(-0.36, 0.22); s.lineTo(-0.26, 0.13);
    s.lineTo(-0.35, 0.09); s.lineTo(-0.22, 0.04);
    s.quadraticCurveTo(-0.1, -0.02, 0, 0);
    const wg = new THREE.ShapeGeometry(s, 6);
    const wing = new THREE.BufferGeometry();
    const src = wg.toNonIndexed();
    const pa = src.attributes.position;
    const col = [];
    const cw = new THREE.Color(0xffffff), cg = glowColor(0x7fe8ff, 3.2);
    for (let i = 0; i < pa.count; i++) {
      const t = Math.min(1, Math.max(0, (-pa.getX(i) - 0.14) / 0.2));
      _c.copy(cw).lerp(cg, t * t);
      col.push(_c.r, _c.g, _c.b);
    }
    wing.setAttribute('position', pa.clone());
    wing.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    wg.dispose(); src.dispose();
    return { boot, wing };
  });
}

      [P.ico1, mtx([0.1, 0.05, -0.09], null, [0.035, 0.048, 0.02]), 0x2a1520],
      [P.ico1, mtx([-0.1, 0.05, -0.09], null, [0.035, 0.048, 0.02]), 0x2a1520],

function starGeo() {
  return cgeo('star', () => {
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const a = Math.PI / 2 + (i / 10) * TAU_;
      const r = i % 2 === 0 ? 0.17 : 0.075;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
    }
    s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.02, bevelSegments: 1 });
    g.translate(0, 0, -0.02);
    return g;
  });
}

function createItemModel(type) {
  const group = new THREE.Group();
  group.name = 'item:' + type;
  const float = new THREE.Group();
  float.scale.setScalar(1.3);
  const spin = new THREE.Group();
  float.add(spin);
  group.add(float);
  if (!ITEM_GLOW[type]) type = 'fish';
  group.add(itemDisc(type));
  const off = Math.random() * TAU_;
  let baseY = 0.6;
  let animate = null;

  if (type === 'boots') {
    const G = bootGeos();
    const boot = new THREE.Mesh(G.boot, VC_MAT()); boot.castShadow = true; spin.add(boot);
    const wingMat = cmat('wingMat', () => new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    const wings = [];
    for (const sz of [1, -1]) {
      const p = new THREE.Group(); p.position.set(-0.08, 0.17, 0.085 * sz); spin.add(p);
      const w = new THREE.Mesh(G.wing, wingMat); p.add(w);
      wings.push({ p, sz });
    }
    spin.rotation.z = 0.12;
    animate = (t) => {
      const f = Math.sin(t * 9 + off);
      for (const w of wings) w.p.rotation.x = (0.35 + 0.45 * f) * w.sz;
    };
  } else if (type === 'life') {
    const heartMat = cmat('heartMat', () => new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.5, emissive: 0xff2a5a, emissiveIntensity: 0.35 }));
    const heart = new THREE.Mesh(heartGeo(), heartMat); heart.castShadow = true; spin.add(heart);
    const halo = new THREE.Mesh(cgeo('haloTorus', () => new THREE.TorusGeometry(0.19, 0.022, 6, 28)), basicGlow('halo', 0xffd76a, 2.6, { blending: THREE.NormalBlending, transparent: false, depthWrite: true }));
    halo.rotation.x = Math.PI / 2 - 0.25;
    halo.position.y = 0.45;
    float.add(halo);
    animate = (t) => {
      const b = 1 + Math.max(0, Math.sin(t * 5 + off)) * 0.08;
      heart.scale.set(b, b, b);
      halo.position.y = 0.45 + Math.sin(t * 3 + off) * 0.025;
      halo.rotation.z = t * 1.5;
    };
  } else if (type === 'shield') {
    baseY = 0.65;
    const orbMat = cmat('itemOrb', () => makeFresnelMaterial(0x7ab8ff, 1));
    const orb = new THREE.Mesh(cgeo('sphere24', () => new THREE.SphereGeometry(1, 24, 16)), orbMat);
    orb.scale.setScalar(0.33);
    orb.renderOrder = 4;
    float.add(orb);
    const starMat = cmat('starMat', () => new THREE.MeshStandardMaterial({ color: 0xffd34a, emissive: 0xffb020, emissiveIntensity: 1.3, flatShading: true, roughness: 0.4 }));
    const star = new THREE.Mesh(starGeo(), starMat); spin.add(star);
    animate = (t) => {
      orbMat.uniforms.uTime.value = t;
      star.rotation.y = t * 1.5;
      star.rotation.z = Math.sin(t * 2 + off) * 0.25;
    };
  } else {
    baseY = 0.55;
    const G = fishGeos();
    const fm = fishMaterial();
    const fish = new THREE.Group(); fish.rotation.z = 0.25; spin.add(fish);
    const body = new THREE.Mesh(G.body, fm); body.castShadow = true; fish.add(body);
    const tailP = new THREE.Group(); tailP.position.x = -0.22; fish.add(tailP);
    tailP.add(new THREE.Mesh(G.tail, fm));
    animate = (t) => {
      tailP.rotation.y = Math.sin(t * 10 + off) * 0.5;
      fish.rotation.y = Math.sin(t * 10 + off + 1) * 0.08;
    };
  }

  function update(dt, time) {
    const t = time === undefined ? performance.now() / 1000 : time;
    float.position.y = baseY + Math.sin(t * 2.4 + off) * 0.08;
    spin.rotation.y = t * 1.3 + off;
    if (animate) animate(t);
  }
  update(0, 0);
  return { group, update };
}

function createReviveCircleModel(color) {
  const R = CFG.REVIVE_RADIUS;
  const group = new THREE.Group();
  group.name = 'reviveCircle';
  const col = new THREE.Color(color === undefined ? 0xffffff : color);

  const haloMat = new THREE.MeshBasicMaterial({ map: ringHaloTexture(), color: col.clone().multiplyScalar(1.3), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const halo = new THREE.Mesh(cgeo('reviveHalo', () => flatDisc(R / 0.75, 40)), haloMat);
  halo.position.y = 0.03; halo.renderOrder = 1; group.add(halo);

  const ringMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(2.4), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(cgeo('reviveRing', () => flatRing(R - 0.07, R + 0.05, 56)), ringMat);
  ring.position.y = 0.04; ring.renderOrder = 2; group.add(ring);

  const dashMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.8), transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  const dash = new THREE.Mesh(cgeo('reviveDash', () => dashedRingGeometry(R * 0.72, R * 0.72 + 0.06, 14, 0.55, 3)), dashMat);
  dash.position.y = 0.045; dash.renderOrder = 2; group.add(dash);
  const dash2 = new THREE.Mesh(cgeo('reviveDash2', () => dashedRingGeometry(R * 0.5, R * 0.5 + 0.035, 8, 0.3, 2)), dashMat);
  dash2.position.y = 0.045; dash2.renderOrder = 2; group.add(dash2);

  const moteMat = new THREE.MeshBasicMaterial({ color: col.clone().lerp(new THREE.Color(0xffffff), 0.5).multiplyScalar(3), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const motes = [];
  const moteGeo = cgeo('mote', () => new THREE.OctahedronGeometry(0.05, 0));
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(moteGeo, moteMat);
    const a = (i / 9) * TAU_ + Math.random() * 0.4;
    const r = R * (0.35 + Math.random() * 0.6);
    m.userData = { a, r, ph: Math.random(), sp: 0.35 + Math.random() * 0.3 };
    group.add(m); motes.push(m);
  }

  const ghost = createKittyModel(color === undefined ? 0xffffff : color);
  ghost.setGhost(true, color);
  ghost.group.scale.setScalar(0.95);
  group.add(ghost.group);

  const off = Math.random() * TAU_;
  const baseRing = col.clone().multiplyScalar(2.4);
  function update(dt, time) {
    const t = time === undefined ? performance.now() / 1000 : time;
    const pulse = 0.5 + 0.5 * Math.sin(t * 4 + off);
    ringMat.color.copy(baseRing).multiplyScalar(0.7 + 0.6 * pulse);
    const rs = 1 + 0.04 * pulse;
    ring.scale.set(rs, 1, rs);
    haloMat.opacity = 0.4 + 0.3 * pulse;
    dash.rotation.y = t * 0.9;
    dash2.rotation.y = -t * 1.4;
    for (const m of motes) {
      const u = m.userData;
      const k = (t * u.sp + u.ph) % 1;
      const a = u.a + t * 0.6;
      m.position.set(Math.cos(a) * u.r, 0.1 + k * 1.7, Math.sin(a) * u.r);
      const s = Math.sin(k * Math.PI);
      m.scale.setScalar(0.4 + s);
      m.rotation.y = t * 3 + u.a;
    }
    ghost.group.position.y = 0.35 + Math.sin(t * 2.2 + off) * 0.12;
    ghost.group.rotation.y = Math.sin(t * 0.7 + off) * 0.6;
    ghost.update(dt, { moving: false, time: t });
  }
  update(0, 0);
  return { group, update };
}
